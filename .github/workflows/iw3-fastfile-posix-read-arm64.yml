name: IW3 original FastFile POSIX reader ARM64 portability (NOT GAME)

on:
  pull_request:
    paths:
      - '.github/workflows/iw3-fastfile-posix-read-arm64.yml'
      - 'third_party/KisakCOD/src/database/db_file_load.cpp'
      - 'third_party/KisakCOD/src/database/db_registry.cpp'
      - 'third_party/KisakCOD/src/database/database.h'
      - 'third_party/KisakCOD/src/database/db_fastfile_posix_io.h'
      - 'third_party/KisakCOD/src/database/db_fastfile_posix_open.h'
      - 'android/iw3-native/db_fastfile_posix_io_native_test.cpp'
      - 'android/iw3-native/platform_native_test.cpp'
      - 'android/iw3-native/CMakeLists.txt'
      - 'tests/test_iw3_android_fastfile_posix_io.py'
      - 'tests/test_iw3_android_fastfile_posix_open.py'
      - 'tools/iw3_android/prepare_real_engine_db_read_posix.py'
  push:
    branches:
      - feature/iw3-native-android-arm64-20261025
    paths:
      - '.github/workflows/iw3-fastfile-posix-read-arm64.yml'
      - 'third_party/KisakCOD/src/database/db_file_load.cpp'
      - 'third_party/KisakCOD/src/database/db_registry.cpp'
      - 'third_party/KisakCOD/src/database/database.h'
      - 'third_party/KisakCOD/src/database/db_fastfile_posix_io.h'
      - 'third_party/KisakCOD/src/database/db_fastfile_posix_open.h'
      - 'android/iw3-native/db_fastfile_posix_io_native_test.cpp'
      - 'android/iw3-native/platform_native_test.cpp'
      - 'android/iw3-native/CMakeLists.txt'
      - 'tests/test_iw3_android_fastfile_posix_io.py'
      - 'tests/test_iw3_android_fastfile_posix_open.py'
      - 'tools/iw3_android/prepare_real_engine_db_read_posix.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iw3-fastfile-posix-read-${{ github.ref }}
  cancel-in-progress: false

jobs:
  posix-read-portability:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NDK_VER: "27.2.12479018"
    steps:
      - uses: actions/checkout@v4

      - name: Run source-level regression and native POSIX reader tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_iw3_android_fastfile_posix_io.py' -v
          python3 -m unittest discover -s tests -p 'test_iw3_android_fastfile_posix_open.py' -v
          c++ -std=c++20 -Wall -Wextra -Werror -UNDEBUG \
            -I third_party/KisakCOD/src/database \
            android/iw3-native/db_fastfile_posix_io_native_test.cpp \
            -o "$RUNNER_TEMP/db_fastfile_posix_io_test"
          "$RUNNER_TEMP/db_fastfile_posix_io_test"
          python3 tools/iw3_android/prepare_real_engine_db_read_posix.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-original-db-read-posix-harness.cpp" \
            --report "$RUNNER_TEMP/iw3-original-db-read-posix-report.json"
          c++ -std=c++20 -Wall -Wextra -Werror -UNDEBUG \
            -I third_party/KisakCOD/src/database \
            "$RUNNER_TEMP/iw3-original-db-read-posix-harness.cpp" \
            -o "$RUNNER_TEMP/iw3-original-db-read-posix-harness"
          "$RUNNER_TEMP/iw3-original-db-read-posix-harness"

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk/cmdline-tools/latest"
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/commandline-tools.zip" \
            'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
          unzip -qo "$RUNNER_TEMP/commandline-tools.zip" -d "$RUNNER_TEMP/commandline-tools"
          mv "$RUNNER_TEMP/commandline-tools/cmdline-tools/"* "$sdk/cmdline-tools/latest/"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" "ndk;${NDK_VER}"
          echo "ANDROID_NDK_HOME=$sdk/ndk/${NDK_VER}" >> "$GITHUB_ENV"

      - name: Compile the same POSIX reader test for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$ndk/aarch64-linux-android26-clang++" \
            -std=c++20 -Wall -Wextra -Werror -UNDEBUG \
            -I third_party/KisakCOD/src/database \
            -c android/iw3-native/db_fastfile_posix_io_native_test.cpp \
            -o "$RUNNER_TEMP/db_fastfile_posix_io_aarch64.o"
          "$ndk/aarch64-linux-android26-clang++" \
            -std=c++20 -Wall -Wextra -Werror -UNDEBUG \
            -I third_party/KisakCOD/src/database \
            -c "$RUNNER_TEMP/iw3-original-db-read-posix-harness.cpp" \
            -o "$RUNNER_TEMP/iw3-original-db-read-posix-harness-aarch64.o"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/db_fastfile_posix_io_aarch64.o" \
            | tee "$RUNNER_TEMP/db-fastfile-posix-io-elf.txt"
          grep -F 'ELF64' "$RUNNER_TEMP/db-fastfile-posix-io-elf.txt"
          grep -F 'AArch64' "$RUNNER_TEMP/db-fastfile-posix-io-elf.txt"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/iw3-original-db-read-posix-harness-aarch64.o" \
            | tee "$RUNNER_TEMP/iw3-original-db-read-posix-harness-elf.txt"
          grep -F 'ELF64' "$RUNNER_TEMP/iw3-original-db-read-posix-harness-elf.txt"
          grep -F 'AArch64' "$RUNNER_TEMP/iw3-original-db-read-posix-harness-elf.txt"
          echo "IW3_FASTFILE_POSIX_READER_AARCH64_OBJECT_PASS"
          echo "IW3_ORIGINAL_DB_READ_POSIX_BODY_AARCH64_COMPILE_PASS"
          "$ndk/aarch64-linux-android26-clang++" \
            -std=c++20 -Wall -Wextra -Werror -UNDEBUG \
            -I android/iw3-native \
            -I third_party/KisakCOD/src \
            -I third_party/KisakCOD/src/qcommon \
            -I third_party/KisakCOD/src/database \
            -c android/iw3-native/platform_native_test.cpp \
            -o "$RUNNER_TEMP/iw3-fastfile-posix-open-platform-test-aarch64.o"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/iw3-fastfile-posix-open-platform-test-aarch64.o" \
            | tee "$RUNNER_TEMP/iw3-fastfile-posix-open-platform-test-elf.txt"
          grep -F 'ELF64' "$RUNNER_TEMP/iw3-fastfile-posix-open-platform-test-elf.txt"
          grep -F 'AArch64' "$RUNNER_TEMP/iw3-fastfile-posix-open-platform-test-elf.txt"
          echo "IW3_FASTFILE_POSIX_OPEN_HELPER_AARCH64_OBJECT_PASS"
          echo "IW3_FASTFILE_LOADER_RUNTIME_INTEGRATED=false"
          echo "IW3_REAL_MAP_LOADED=false"
          echo "IW3_GAMEPLAY_PROVEN=false"
          echo "IW3_PLAYABLE_APK=false"

      - name: Upload reader evidence (NOT APK)
        uses: actions/upload-artifact@v4
        with:
          name: iw3-fastfile-posix-reader-aarch64-NOT-APK
          path: |
            ${{ runner.temp }}/db-fastfile-posix-io-elf.txt
            ${{ runner.temp }}/db_fastfile_posix_io_aarch64.o
            ${{ runner.temp }}/iw3-original-db-read-posix-harness.cpp
            ${{ runner.temp }}/iw3-original-db-read-posix-harness-aarch64.o
            ${{ runner.temp }}/iw3-original-db-read-posix-harness-elf.txt
            ${{ runner.temp }}/iw3-original-db-read-posix-report.json
            ${{ runner.temp }}/iw3-fastfile-posix-open-platform-test-aarch64.o
            ${{ runner.temp }}/iw3-fastfile-posix-open-platform-test-elf.txt
