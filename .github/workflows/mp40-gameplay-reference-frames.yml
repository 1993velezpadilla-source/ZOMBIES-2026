name: Capture MP40 real BO2 gameplay frames (no generated images)
on:
  push:
    branches:
      - research/mp40-bo2-gameplay-frame-audit-20261104
    paths:
      - tools/mp40_extract_gameplay_frames.py
      - .github/workflows/mp40-gameplay-reference-frames.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grab-real-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install video frame tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install -q --break-system-packages --upgrade "yt-dlp[default]" Pillow
          yt-dlp --version
      - name: Download actual Black Ops II MP40 reload showcase and Origins gameplay
        shell: bash
        run: |
          set +e
          mkdir -p mp40_video mp40_screenshots
          for row in 'BO2_reload uHk-rGy5mAg' 'BO2_alt_reload isO3zwIZOsM' 'BO2_origins 8_bhQM97Jw4'; do
            set -- $row
            label="$1"
            video="$2"
            echo "VIDEO_SOURCE=$label https://www.youtube.com/watch?v=$video"
            timeout 110 yt-dlp --no-playlist --retries 2 --fragment-retries 2 \
              -f 'b[height<=720]/b[height<=1080]/b' --merge-output-format mp4 \
              -o "mp40_video/$label.%(ext)s" "https://www.youtube.com/watch?v=$video" \
              2>&1 | tee "mp40_video/$label.log"
            echo "$?" > "mp40_video/$label.exitcode"
          done
          true
      - name: Capture genuine video frames at identified MP40 portions
        shell: bash
        run: |
          set +e
          run_capture() {
            source=$(find mp40_video -maxdepth 1 -type f -name "$1.*" ! -name '*.log' ! -name '*.exitcode' | head -1)
            if [ -n "$source" ]; then
              python3 tools/mp40_extract_gameplay_frames.py "$source" "$2" "$3" "$4" "$5"
              echo "$2 exit=$?"
            else
              echo "NO_SOURCE_VIDEO $1"
            fi
          }
          run_capture BO2_reload BO2_MP40_RELOAD_12 219.4 3.8 12
          run_capture BO2_alt_reload BO2_MP40_ALTERNATE_RELOAD_12 115.7 7.0 12
          run_capture BO2_origins BO2_MP40_ORIGINS_GAMEPLAY_18 119 32 18
          true
      - name: Upload ONLY real screenshots, timestamp and video-fetch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MP40_BO2_AUTHENTIC_GAMEPLAY_SCREENSHOTS
          path: |
            mp40_screenshots/
            mp40_video/*.log
            mp40_video/*.exitcode
          retention-days: 7
          if-no-files-found: error
