name: FIX56 real VoxeLibre live chase vs FIX55 breadcrumb path (Android ARM64)
on:
  push:
    branches: [fix/fix56-voxelibre-live-target-routing-20261113]
    paths:
      - '.github/workflows/fix56-live-chase-apk.yml'
      - 'incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/rotu_ai.lua'
      - 'incoming/luanti-fix50b/tests/test_fix55_rotu_bot_ai.lua'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fix56-native-path:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Assert source-compatible native AI and all old combat/gameplay tests
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          for f in incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/*.lua; do luac5.4 -p "$f"; done
          lua5.4 incoming/luanti-fix50b/tests/test_fix55_rotu_bot_ai.lua
          lua5.4 incoming/luanti-fix50b/tests/test_v26_original.lua
          lua5.4 incoming/luanti-fix50b/tests/test_fix53_chase_sizes.lua
          lua5.4 incoming/luanti-fix50b/tests/test_fix54_original_viril_combatfx.lua
          lua5.4 incoming/luanti-fix50b/tests/test_runtime.lua
      - name: Retrieve exact FIX55 signed APK preserving font startup, scores and weapons
        uses: actions/download-artifact@v4
        with:
          run-id: 43397907694
          artifact-ids: 14023279755
          github-token: ${{ github.token }}
          path: fix56-base
          merge-multiple: true
      - name: Package only FIX56 live target routing adaptation
        run: |
          set -euo pipefail
          mkdir -p fix56-build/overlay
          cp incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/rotu_ai.lua fix56-build/overlay/rotu_ai.lua
          test -s fix56-base/COD4-ZOMBIES-FIX55-ROTU-BOT-AI-ARM64.apk
          python3 incoming/luanti-fix50b/build_playable_test.py \
            --fix49c fix56-base/COD4-ZOMBIES-FIX55-ROTU-BOT-AI-ARM64.apk \
            --rebuilt fix56-base/COD4-ZOMBIES-FIX55-ROTU-BOT-AI-ARM64.apk \
            --lua incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/init.lua \
            --overlay-dir fix56-build/overlay \
            --output fix56-build/unsigned.apk
      - name: Verify exact game resources, weapons, native library and audio
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,lzma,io,json,pathlib
          old=pathlib.Path('fix56-base/COD4-ZOMBIES-FIX55-ROTU-BOT-AI-ARM64.apk')
          new=pathlib.Path('fix56-build/unsigned.apk')
          report=json.loads(pathlib.Path('fix56-build/packaging_report.json').read_text())
          root='games/voxelibre/mods/xz_zombies_classic/'
          assert report['assets']['baseline_asset_count']==9716
          assert report['assets']['candidate_asset_count']==9716
          assert report['assets']['changed']=={root+'init.lua':'replaced',root+'rotu_ai.lua':'replaced'}
          with zipfile.ZipFile(old) as original,zipfile.ZipFile(new) as patched:
            for entry in original.infolist():
              if entry.filename=='assets/assets.zip' or entry.filename.startswith('META-INF/'):continue
              out=patched.getinfo(entry.filename)
              assert (entry.CRC,entry.file_size)==(out.CRC,out.file_size),entry.filename
            assert original.read('lib/arm64-v8a/libluanti.so')==patched.read('lib/arm64-v8a/libluanti.so')
            for apk,label in [(original,'old'),(patched,'new')]:
              with zipfile.ZipFile(io.BytesIO(apk.read('assets/assets.zip'))) as layer:
                assert layer.comment==b'XZ-ASSETS-1:9716',(label,layer.comment)
                with zipfile.ZipFile(io.BytesIO(lzma.decompress(layer.read('luanti-assets.zip.xz')))) as assets:
                  assert len(assets.namelist())==9716
                  if label=='old': prev={f.filename:(f.CRC,f.file_size) for f in assets.infolist()}
                  else:
                    for item in assets.infolist():
                      if item.filename==root+'rotu_ai.lua':continue
                      assert (item.CRC,item.file_size)==prev[item.filename],item.filename
                    ai=assets.read(root+'rotu_ai.lua')
                    assert b"entity.state=='gowp'" in ai and b'entity.path.last_seen_target_pos' in ai
                    assert b'entity.path.way=nil' in ai and b'entity.pathfinding=1' in ai
                    assert b'entity.gopath(' not in ai
          print('PASS: all weapons, animations, fonts, sound, models, v26 scripts unchanged, no old line-tracing')
          PY
      - name: Sign Android FIX56 developer-only build and validate
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/zipalign" -f -p 4 fix56-build/unsigned.apk fix56-build/aligned.apk
          keytool -genkeypair -keystore "$RUNNER_TEMP/fix56.jks" -alias fix56 \
            -storepass android -keypass android -keyalg RSA -keysize 3072 -validity 3650 -noprompt \
            -dname 'CN=FIX56 VoxeLibre Live Chase Developer Test,OU=Development,O=Xziel,C=US'
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/fix56.jks" --ks-key-alias fix56 \
            --ks-pass pass:android --key-pass pass:android \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out fix56-build/COD4-ZOMBIES-FIX56-NATIVE-LIVE-CHASE-ARM64.apk fix56-build/aligned.apk
          "$TOOLS/apksigner" verify --verbose fix56-build/COD4-ZOMBIES-FIX56-NATIVE-LIVE-CHASE-ARM64.apk
          "$TOOLS/aapt" dump badging fix56-build/COD4-ZOMBIES-FIX56-NATIVE-LIVE-CHASE-ARM64.apk | tee fix56-build/badging.txt
          grep -q "package: name='com.xziel.zombies.fix50btest' versionCode='5180055'" fix56-build/badging.txt
          unzip -t fix56-build/COD4-ZOMBIES-FIX56-NATIVE-LIVE-CHASE-ARM64.apk > /dev/null
          sha256sum fix56-build/COD4-ZOMBIES-FIX56-NATIVE-LIVE-CHASE-ARM64.apk | tee fix56-build/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FIX56-VOXELIBRE-NATIVE-LIVE-CHASE-ARM64
          path: |
            fix56-build/COD4-ZOMBIES-FIX56-NATIVE-LIVE-CHASE-ARM64.apk
            fix56-build/packaging_report.json
            fix56-build/badging.txt
            fix56-build/sha256.txt
          if-no-files-found: error
          retention-days: 14
