name: Android emulator COD4 startup smoke test
on:
  push:
    paths:
      - '.github/workflows/android-emulator-smoke.yml'
  workflow_dispatch:

# Untrusted APK is installed only in a disposable, network-disabled emulator.
# No main game data, signing keys, or repository write credentials are supplied.
permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download original COD4 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p _release_assets/cod4
          gh release download mediafire-COD4-apk --repo "$GITHUB_REPOSITORY" --pattern COD4.apk --dir _release_assets/cod4
          echo '40386503d564b0985423339b5ccd5611dc60ce08ebe1b4ae494d4de22a62473c  _release_assets/cod4/COD4.apk' | sha256sum --check
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch disposable API 35 x86_64 emulator with ARM translation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 3072M
          disk-size: 8192M
          force-avd-creation: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash tools/android_emulator_smoke.sh
      - name: Save smoke-test report and diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cod4-android-emulator-smoke
          path: |
            smoke-out/smoke-report.json
            smoke-out/install-result.txt
            smoke-out/launch-result.txt
            smoke-out/android-logcat-filtered.txt
            smoke-out/screenshot.png
          retention-days: 14
          if-no-files-found: warn
