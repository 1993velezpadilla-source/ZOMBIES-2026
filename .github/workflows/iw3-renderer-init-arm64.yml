permissions:
  contents: read

concurrency:
  group: iw3-renderer-init-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer-tracking-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run original renderer static tracking under ASan/UBSan
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_iw3_android_renderer_*.py' -v
          echo 'IW3_ORIGINAL_RENDERER_STATIC_TRACKING_LP64_PASS'
          echo 'IW3_RENDERER_FRAME_PROVEN=false'
          echo 'IW3_PLAYABLE_APK=false'

  original-renderer-compile-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NDK_VER: "27.2.12479018"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Android NDK and OpenAL headers
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk/cmdline-tools/latest"
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/commandline-tools.zip" \
            'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
          unzip -qo "$RUNNER_TEMP/commandline-tools.zip" -d "$RUNNER_TEMP/commandline-tools"
          mv "$RUNNER_TEMP/commandline-tools/cmdline-tools/"* "$sdk/cmdline-tools/latest/"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" "ndk;${NDK_VER}"
          echo "ANDROID_NDK_HOME=$sdk/ndk/${NDK_VER}" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libopenal-dev
          mkdir -p "$RUNNER_TEMP/iw3-openal-headers"
          cp -a /usr/include/AL "$RUNNER_TEMP/iw3-openal-headers/"
      - name: Probe authentic full r_init.cpp without graphics stubs
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          root="$GITHUB_WORKSPACE/third_party/KisakCOD/src"
          report="$RUNNER_TEMP/iw3-renderer-compile-report.txt"
          set +e
          "$ndk/aarch64-linux-android26-clang++" \
            -std=c++20 -DKISAK_SP=1 -DKISAK_OPENAL=1 \
            -DIW3_ANDROID_DISABLE_SCRIPT_DEBUGGER=1 \
            -DIW3_ANDROID_COMMON_HEADER_ONLY_OPENAL=1 \
            -fms-extensions -UNDEBUG -O2 -fsigned-char -frounding-math -fno-fast-math \
            -I "$GITHUB_WORKSPACE/android/iw3-native/common_compat" \
            -I "$GITHUB_WORKSPACE/android/iw3-native" \
            -I "$root" \
            -I "$GITHUB_WORKSPACE/third_party/KisakCOD/deps" \
            -I "$RUNNER_TEMP/iw3-openal-headers" \
            -c "$root/gfx_d3d/r_init.cpp" \
            -o "$RUNNER_TEMP/iw3-original-r-init-aarch64.o" >"$report" 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            "$ndk/llvm-readelf" -h "$RUNNER_TEMP/iw3-original-r-init-aarch64.o" | tee -a "$report"
            "$ndk/llvm-nm" -C --defined-only "$RUNNER_TEMP/iw3-original-r-init-aarch64.o" | grep -F 'R_BeginRegistration(' | tee -a "$report"
            # Compiling a translation unit is not linking a complete renderer.
            # Preserve the genuine unresolved external dependency inventory so
            # the next GLES/backend link work is driven by actual ARM64 symbols.
            "$ndk/llvm-nm" -C -u "$RUNNER_TEMP/iw3-original-r-init-aarch64.o" \
              > "$RUNNER_TEMP/iw3-r-init-arm64-undefined-symbols.txt"
            echo "IW3_ORIGINAL_RENDERER_OBJECT_UNDEFINED_SYMBOL_COUNT=$(wc -l < "$RUNNER_TEMP/iw3-r-init-arm64-undefined-symbols.txt")" | tee -a "$report"
            echo 'First 100 unresolved object symbols (not a linked renderer):' | tee -a "$report"
            sed -n '1,100p' "$RUNNER_TEMP/iw3-r-init-arm64-undefined-symbols.txt" | tee -a "$report"
            echo 'IW3_ORIGINAL_RENDERER_R_INIT_AARCH64_COMPILED=true' | tee -a "$report"
          else
            echo "IW3_ORIGINAL_RENDERER_R_INIT_AARCH64_COMPILED=false (compiler_exit=$rc)" | tee -a "$report"
            echo 'First 100 compiler diagnostic lines:'
            sed -n '1,100p' "$report"
          fi
          echo 'IW3_RENDERER_BACKEND_LINKED=false' | tee -a "$report"
          echo 'IW3_RENDERER_FRAME_PROVEN=false' | tee -a "$report"
          echo 'IW3_REAL_MAP_LOADED=false' | tee -a "$report"
          echo 'IW3_GAMEPLAY_PROVEN=false' | tee -a "$report"
          echo 'IW3_PLAYABLE_APK=false' | tee -a "$report"
          # This is an evidence-gathering probe, not a claim that compilation passed.
      - name: Probe authentic original r_rendercmds.cpp for ARM64 (NOT a linked renderer)
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          root="$GITHUB_WORKSPACE/third_party/KisakCOD/src"
          report="$RUNNER_TEMP/iw3-original-rendercmds-arm64-report.txt"
          out="$RUNNER_TEMP/iw3-original-rendercmds-aarch64.o"
          set +e
          "$ndk/aarch64-linux-android26-clang++" \
            -std=c++20 -DKISAK_SP=1 -DKISAK_OPENAL=1 \
            -DIW3_ANDROID_DISABLE_SCRIPT_DEBUGGER=1 \
            -DIW3_ANDROID_COMMON_HEADER_ONLY_OPENAL=1 \
            -fms-extensions -UNDEBUG -O2 -fsigned-char -frounding-math -fno-fast-math \
            -ferror-limit=25 \
            -I "$GITHUB_WORKSPACE/android/iw3-native/common_compat" \
            -I "$GITHUB_WORKSPACE/android/iw3-native" \
            -I "$root" \
            -I "$GITHUB_WORKSPACE/third_party/KisakCOD/deps" \
            -I "$RUNNER_TEMP/iw3-openal-headers" \
            -c "$root/gfx_d3d/r_rendercmds.cpp" -o "$out" >"$report" 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            "$ndk/llvm-readelf" -h "$out" | grep -E 'Class:|Machine:' | tee -a "$report"
            "$ndk/llvm-nm" -C --defined-only "$out" | grep -F 'R_GetCommandBuffer(' | tee -a "$report"
            "$ndk/llvm-nm" -C -u "$out" > "$RUNNER_TEMP/iw3-original-rendercmds-arm64-undefined.txt"
            echo "IW3_ORIGINAL_RENDERCMDS_UNDEFINED_SYMBOL_COUNT=$(wc -l < "$RUNNER_TEMP/iw3-original-rendercmds-arm64-undefined.txt")" | tee -a "$report"
            echo 'IW3_ORIGINAL_RENDERCMDS_AARCH64_COMPILED=true' | tee -a "$report"
          else
            echo "IW3_ORIGINAL_RENDERCMDS_AARCH64_COMPILED=false (compiler_exit=$rc)" | tee -a "$report"
            sed -n '1,110p' "$report"
          fi
          echo 'IW3_RENDERER_BACKEND_LINKED=false' | tee -a "$report"
          echo 'IW3_RENDERER_FRAME_PROVEN=false' | tee -a "$report"
          echo 'IW3_PLAYABLE_APK=false' | tee -a "$report"
          # Deliberately a diagnostic probe; do not equate a green job to a game.
      - name: Probe authentic rb_backend.cpp command consumer on AArch64 (NOT GLES renderer)
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          root="$GITHUB_WORKSPACE/third_party/KisakCOD/src"
          report="$RUNNER_TEMP/iw3-original-rb-backend-arm64-report.txt"
          out="$RUNNER_TEMP/iw3-original-rb-backend-aarch64.o"
          set +e
          "$ndk/aarch64-linux-android26-clang++" \
            -std=c++20 -DKISAK_SP=1 -DKISAK_OPENAL=1 \
            -DIW3_ANDROID_DISABLE_SCRIPT_DEBUGGER=1 \
            -DIW3_ANDROID_COMMON_HEADER_ONLY_OPENAL=1 \
            -fms-extensions -UNDEBUG -O2 -fsigned-char -frounding-math -fno-fast-math \
            -ferror-limit=25 \
            -I "$GITHUB_WORKSPACE/android/iw3-native/common_compat" \
            -I "$GITHUB_WORKSPACE/android/iw3-native" \
            -I "$root" \
            -I "$GITHUB_WORKSPACE/third_party/KisakCOD/deps" \
            -I "$RUNNER_TEMP/iw3-openal-headers" \
            -c "$root/gfx_d3d/rb_backend.cpp" -o "$out" >"$report" 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            "$ndk/llvm-readelf" -h "$out" | grep -E 'Class:|Machine:' | tee -a "$report"
            "$ndk/llvm-nm" -C --defined-only "$out" | grep -F 'RB_ExecuteRenderCommands(' | tee -a "$report" || true
            "$ndk/llvm-nm" -C -u "$out" > "$RUNNER_TEMP/iw3-original-rb-backend-arm64-undefined.txt"
            echo "IW3_ORIGINAL_BACKEND_UNDEFINED_SYMBOL_COUNT=$(wc -l < "$RUNNER_TEMP/iw3-original-rb-backend-arm64-undefined.txt")" | tee -a "$report"
            echo 'IW3_ORIGINAL_BACKEND_RB_BACKEND_AARCH64_COMPILED=true' | tee -a "$report"
          else
            echo "IW3_ORIGINAL_BACKEND_RB_BACKEND_AARCH64_COMPILED=false (compiler_exit=$rc)" | tee -a "$report"
            sed -n '1,140p' "$report"
          fi
          echo 'IW3_RENDERER_BACKEND_LINKED=false' | tee -a "$report"
          echo 'IW3_RENDERER_FRAME_PROVEN=false' | tee -a "$report"
          echo 'IW3_PLAYABLE_APK=false' | tee -a "$report"
          # A compile probe is evidence, never proof of rendering or gameplay.
      - name: Compile original IW3 D3D9 GPU-query translation unit for ARM64 (NOT GLES)
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          root="$GITHUB_WORKSPACE/third_party/KisakCOD/src"
          out="$RUNNER_TEMP/iw3-original-r-setstate-d3d-aarch64.o"
          "$ndk/aarch64-linux-android26-clang++" \
            -std=c++20 -DKISAK_SP=1 -DKISAK_OPENAL=1 \
            -DIW3_ANDROID_DISABLE_SCRIPT_DEBUGGER=1 \
            -DIW3_ANDROID_COMMON_HEADER_ONLY_OPENAL=1 \
            -fms-extensions -UNDEBUG -O2 -fsigned-char -frounding-math -fno-fast-math \
            -I "$GITHUB_WORKSPACE/android/iw3-native/common_compat" \
            -I "$GITHUB_WORKSPACE/android/iw3-native" \
            -I "$root" \
            -I "$GITHUB_WORKSPACE/third_party/KisakCOD/deps" \
            -I "$RUNNER_TEMP/iw3-openal-headers" \
            -c "$root/gfx_d3d/r_setstate_d3d.cpp" -o "$out"
          "$ndk/llvm-readelf" -h "$out" | grep -E 'Class:|Machine:'
          "$ndk/llvm-nm" -C --defined-only "$out" | grep -F 'RB_IsGpuFenceFinished()'
          echo 'IW3_ORIGINAL_GPU_QUERY_AARCH64_COMPILED=true'
          echo 'IW3_GLES3_GPU_SYNC_EGL_LIFECYCLE_WIRED=false'
          echo 'IW3_PLAYABLE_APK=false'
      - name: Relocatable link three original IW3 renderer units for AArch64 (NOT a GLES backend)
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          report="$RUNNER_TEMP/iw3-original-renderer-three-tu-link-report.txt"
          out="$RUNNER_TEMP/iw3-original-renderer-three-tu-aarch64.o"
          inputs=(
            "$RUNNER_TEMP/iw3-original-r-init-aarch64.o"
            "$RUNNER_TEMP/iw3-original-rendercmds-aarch64.o"
            "$RUNNER_TEMP/iw3-original-rb-backend-aarch64.o"
          )
          for input in "${inputs[@]}"; do
            if [ ! -s "$input" ]; then
              echo "IW3_ORIGINAL_RENDERER_THREE_TU_RELOCATABLE_LINK=false (missing $input)" | tee -a "$report"
              echo 'IW3_RENDERER_BACKEND_LINKED=false' | tee -a "$report"
              echo 'IW3_PLAYABLE_APK=false' | tee -a "$report"
              exit 0
            fi
          done
          # A relocatable link checks duplicate definitions and resolves
          # inter-unit references; it intentionally allows unresolved engine
          # services and must NEVER be reported as a runnable GLES renderer.
          set +e
          "$ndk/ld.lld" -r -o "$out" "${inputs[@]}" > "$report" 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            "$ndk/llvm-readelf" -h "$out" | grep -E 'Class:|Machine:' | tee -a "$report"
            "$ndk/llvm-nm" -C --defined-only "$out" | grep -F -e 'R_BeginRegistration(' -e 'R_GetCommandBuffer(' -e 'RB_CallExecuteRenderCommands(' | tee -a "$report"
            "$ndk/llvm-nm" -C -u "$out" > "$RUNNER_TEMP/iw3-original-renderer-three-tu-undefined.txt"
            echo "IW3_ORIGINAL_RENDERER_THREE_TU_UNDEFINED_SYMBOL_COUNT=$(wc -l < "$RUNNER_TEMP/iw3-original-renderer-three-tu-undefined.txt")" | tee -a "$report"
            echo 'IW3_ORIGINAL_RENDERER_THREE_TU_RELOCATABLE_LINK=true' | tee -a "$report"
          else
            echo "IW3_ORIGINAL_RENDERER_THREE_TU_RELOCATABLE_LINK=false (linker_exit=$rc)" | tee -a "$report"
            sed -n '1,100p' "$report"
          fi
          echo 'IW3_RENDERER_BACKEND_LINKED=false' | tee -a "$report"
          echo 'IW3_RENDERER_FRAME_PROVEN=false' | tee -a "$report"
          echo 'IW3_REAL_MAP_LOADED=false' | tee -a "$report"
          echo 'IW3_GAMEPLAY_PROVEN=false' | tee -a "$report"
          echo 'IW3_PLAYABLE_APK=false' | tee -a "$report"
          # Do not mask duplicate-definition or relocation failures.
          exit "$rc"
