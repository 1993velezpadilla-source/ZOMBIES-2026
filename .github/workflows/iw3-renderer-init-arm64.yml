      - name: Probe full authentic R_HW_SetRenderTarget translation unit on ARM64 (NOT GAME)
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          root="$GITHUB_WORKSPACE/third_party/KisakCOD/src"
          report="$RUNNER_TEMP/iw3-original-r-state-arm64-report.txt"
          obj="$RUNNER_TEMP/iw3-original-r-state-aarch64.o"
          set +e
          "$ndk/aarch64-linux-android26-clang++" \
            -std=c++20 -DKISAK_SP=1 -DKISAK_OPENAL=1 \
            -DIW3_ANDROID_DISABLE_SCRIPT_DEBUGGER=1 \
            -DIW3_ANDROID_COMMON_HEADER_ONLY_OPENAL=1 \
            -fms-extensions -UNDEBUG -O2 -fsigned-char -frounding-math -fno-fast-math \
            -ferror-limit=25 \
            -I "$GITHUB_WORKSPACE/android/iw3-native/common_compat" \
            -I "$GITHUB_WORKSPACE/android/iw3-native" \
            -I "$root" -I "$GITHUB_WORKSPACE/third_party/KisakCOD/deps" \
            -I "$RUNNER_TEMP/iw3-openal-headers" \
            -c "$root/gfx_d3d/r_state.cpp" -o "$obj" >"$report" 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'IW3_ORIGINAL_R_STATE_AARCH64_COMPILED=true' | tee -a "$report"
            "$ndk/llvm-nm" -C --defined-only "$obj" | grep -F 'R_HW_SetRenderTarget(' | tee -a "$report"
            "$ndk/aarch64-linux-android26-clang++" -std=c++20 -O2 -c \
              "$root/gfx_d3d/r_android_target.cpp" -o "$RUNNER_TEMP/iw3-android-target-aarch64.o"
            "$ndk/ld.lld" -r -o "$RUNNER_TEMP/iw3-original-r-state-plus-target-aarch64.o" \
              "$obj" "$RUNNER_TEMP/iw3-android-target-aarch64.o"
            "$ndk/llvm-nm" -C -u "$RUNNER_TEMP/iw3-original-r-state-plus-target-aarch64.o" \
              > "$RUNNER_TEMP/iw3-original-r-state-plus-target-undefined.txt"
            if grep -F 'R_AndroidGlesBindTarget(' \
              "$RUNNER_TEMP/iw3-original-r-state-plus-target-undefined.txt"; then
              echo 'IW3_ORIGINAL_R_STATE_TARGET_BRIDGE_RESOLVED=false'
              exit 1
            fi
            echo 'IW3_ORIGINAL_R_STATE_TARGET_BRIDGE_RESOLVED=true (relocatable only)'
          else
            echo "IW3_ORIGINAL_R_STATE_AARCH64_COMPILED=false (compiler_exit=$rc)" | tee -a "$report"
            sed -n '1,110p' "$report"
          fi
          echo 'IW3_RENDERER_FRAME_PROVEN=false'
          echo 'IW3_PLAYABLE_APK=false'
