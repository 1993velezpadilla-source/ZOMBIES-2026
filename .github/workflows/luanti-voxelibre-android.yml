name: Build VoxeLibre Sandbox Android APK

on:
  push:
    branches:
      - feature/luanti-voxelibre-sandbox-android-20261105
    paths:
      - sandbox/luanti/**
      - .github/workflows/luanti-voxelibre-android.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-arm64:
    name: Android ARM64 Luanti + VoxeLibre
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout project build recipe
        uses: actions/checkout@v4

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext zip unzip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Retrieve pinned original open-source engine and game
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 5.18.0 https://github.com/luanti-org/luanti.git "$RUNNER_TEMP/luanti"
          git clone --depth 1 --branch master https://github.com/VoxeLibre/VoxeLibre.git "$RUNNER_TEMP/voxelibre"
          test "$(git -C "$RUNNER_TEMP/voxelibre" rev-parse HEAD)" = "4492ce6ff8d856daa4567abe2ea689f4e7a39842"
          mkdir -p "$RUNNER_TEMP/luanti/games"
          mv "$RUNNER_TEMP/voxelibre" "$RUNNER_TEMP/luanti/games/voxelibre"
          rm -rf "$RUNNER_TEMP/luanti/games/voxelibre/.git"
          test -f "$RUNNER_TEMP/luanti/games/voxelibre/game.conf"
          python3 "$GITHUB_WORKSPACE/sandbox/luanti/prepare.py" "$RUNNER_TEMP/luanti"

      - name: Build debug-signed APK (installable ARM64)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/luanti/android"
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Inspect actual APK payload for VoxeLibre
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          find "$RUNNER_TEMP/luanti/android/app/build/outputs/apk/debug" -name "*.apk" -print
          APK="$RUNNER_TEMP/luanti/android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk"
          python3 "$GITHUB_WORKSPACE/sandbox/luanti/verify_apk.py" "$APK"
          cp "$APK" "$RUNNER_TEMP/dist/Voxel-Sandbox-ARM64-debug.apk"
          sha256sum "$RUNNER_TEMP/dist/Voxel-Sandbox-ARM64-debug.apk"

      - name: Upload installable APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voxel-Sandbox-ARM64-APK
          path: ${{ runner.temp }}/dist/Voxel-Sandbox-ARM64-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download as GitHub prerelease
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "voxel-sandbox-test-${GITHUB_RUN_NUMBER}" \
            "$RUNNER_TEMP/dist/Voxel-Sandbox-ARM64-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Voxel Sandbox ARM64 build ${GITHUB_RUN_NUMBER}" \
            --notes "Luanti 5.18.0 + complete VoxeLibre. Test-only debug-signed APK. Creative and Survival. Full source and recipe in this branch."
