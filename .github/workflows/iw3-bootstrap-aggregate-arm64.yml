name: IW3 authentic SP bootstrap aggregate ARM64 (NOT GAME)

on:
  pull_request:
    branches: [feature/zombies-offline-sp-weapons-20261024]
    paths:
      - '.github/workflows/iw3-bootstrap-aggregate-arm64.yml'
      - 'android/iw3-native/CMakeLists.txt'
      - 'third_party/KisakCOD/src/**'
  push:
    branches: [feature/iw3-native-android-arm64-20261025]
    paths:
      - '.github/workflows/iw3-bootstrap-aggregate-arm64.yml'
      - 'android/iw3-native/CMakeLists.txt'
      - 'third_party/KisakCOD/src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-bootstrap-aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install NDK and original OpenAL API headers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libopenal-dev
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk/cmdline-tools/latest"
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/tools.zip" 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
          unzip -qo "$RUNNER_TEMP/tools.zip" -d "$RUNNER_TEMP/tools"
          mv "$RUNNER_TEMP/tools/cmdline-tools/"* "$sdk/cmdline-tools/latest/"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$sdk/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Prepare authentic KisakCOD math, surface and config registry sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iw3-bootstrap-source"
          python3 tools/iw3_android/prepare_real_engine_math.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-bootstrap-source/com_math_anglevectors.cpp" \
            --surface-output "$RUNNER_TEMP/iw3-bootstrap-source/surfaceflags.cpp" \
            --constant-output "$RUNNER_TEMP/iw3-bootstrap-source/com_constantconfigstrings.cpp" \
            --report "$RUNNER_TEMP/iw3-bootstrap-source/source-evidence.json"
      - name: Audit all required original-source inputs before CMake (NOT GAME)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$RUNNER_TEMP/bootstrap-prerequisites.log"
          import pathlib, re, sys
          cmake = pathlib.Path('android/iw3-native/CMakeLists.txt').read_text()
          required = re.findall(r'if\(NOT (IW3_EXTRACTED_[A-Z_]+) OR NOT EXISTS', cmake)
          provided = {'IW3_EXTRACTED_MATH', 'IW3_EXTRACTED_SURFACE', 'IW3_EXTRACTED_CONSTANTS'}
          missing = sorted(set(required) - provided)
          print('IW3_BOOTSTRAP_SOURCE_PREREQUISITE_AUDIT_NOT_GAME')
          print('Provided genuine extraction inputs:', ', '.join(sorted(provided)))
          print('Required but not yet staged by this workflow:', len(missing))
          for key in missing:
              print('MISSING_ORIGINAL_SOURCE_INPUT:', key)
          if missing:
              print('BLOCKED: stage authentic KisakCOD extractions before attempting aggregate CMake configure.')
              sys.exit(1)
          PY
      - name: Configure authentic Android ARM64 object targets
        shell: bash
        run: |
          set -euo pipefail
          cmake -S android/iw3-native -B "$RUNNER_TEMP/iw3-bootstrap-build" \
            -DIW3_EXTRACTED_MATH="$RUNNER_TEMP/iw3-bootstrap-source/com_math_anglevectors.cpp" \
            -DIW3_EXTRACTED_SURFACE="$RUNNER_TEMP/iw3-bootstrap-source/surfaceflags.cpp" \
            -DIW3_EXTRACTED_CONSTANTS="$RUNNER_TEMP/iw3-bootstrap-source/com_constantconfigstrings.cpp" \
            -DIW3_REAL_HEADER_ROOT="$GITHUB_WORKSPACE/third_party/KisakCOD/src/universal" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DIW3_OPENAL_HEADERS_ROOT=/usr/include \
            2>&1 | tee "$RUNNER_TEMP/bootstrap-build.log"
      - name: Compile seven original translation units as one explicit dependency target
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/iw3-bootstrap-build" --target iw3_sp_bootstrap_compile -j2 2>&1 | tee "$RUNNER_TEMP/bootstrap-build.log"
          echo 'IW3_AUTHENTIC_BOOTSTRAP_AGGREGATE_COMPILE_PASS'
          echo 'IW3_PLAYABLE_APK=false'
      - name: Preserve compiler diagnostics (NOT APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iw3-authentic-bootstrap-aggregate-compile-log-NOT-APK
          path: |\n            ${{ runner.temp }}/bootstrap-build.log\n            ${{ runner.temp }}/bootstrap-prerequisites.log
          if-no-files-found: warn
          retention-days: 30
