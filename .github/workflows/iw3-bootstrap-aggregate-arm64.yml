name: IW3 authentic SP bootstrap aggregate ARM64 (NOT GAME)

on:
  pull_request:
    branches: [feature/zombies-offline-sp-weapons-20261024]
    paths:
      - '.github/workflows/iw3-bootstrap-aggregate-arm64.yml'
      - 'android/iw3-native/bootstrap_compile/CMakeLists.txt'
      - 'third_party/KisakCOD/src/**'
  push:
    branches: [feature/iw3-native-android-arm64-20261025]
    paths:
      - '.github/workflows/iw3-bootstrap-aggregate-arm64.yml'
      - 'android/iw3-native/bootstrap_compile/CMakeLists.txt'
      - 'third_party/KisakCOD/src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-bootstrap-aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install NDK and original OpenAL API headers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libopenal-dev
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk/cmdline-tools/latest"
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/tools.zip" 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
          unzip -qo "$RUNNER_TEMP/tools.zip" -d "$RUNNER_TEMP/tools"
          mv "$RUNNER_TEMP/tools/cmdline-tools/"* "$sdk/cmdline-tools/latest/"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$sdk/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Stage real OpenAL headers for Android cross-compiler
        shell: bash
        run: |
          set -euo pipefail
          test -f /usr/include/AL/al.h
          mkdir -p "$RUNNER_TEMP/iw3-openal-headers"
          cp -a /usr/include/AL "$RUNNER_TEMP/iw3-openal-headers/AL"
          test -f "$RUNNER_TEMP/iw3-openal-headers/AL/al.h"
      - name: Configure isolated genuine SP translation-unit compile gate
        shell: bash
        run: |
          set -euo pipefail
          cmake -S android/iw3-native/bootstrap_compile -B "$RUNNER_TEMP/iw3-bootstrap-build" \
            -DIW3_ENGINE_ROOT="$GITHUB_WORKSPACE/third_party/KisakCOD/src" \
            -DIW3_OPENAL_HEADERS_ROOT="$RUNNER_TEMP/iw3-openal-headers" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee "$RUNNER_TEMP/bootstrap-build.log"
      - name: Compile eight original translation units as one explicit dependency target
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/iw3-bootstrap-build" --target iw3_sp_bootstrap_compile -j2 2>&1 | tee -a "$RUNNER_TEMP/bootstrap-build.log"
          echo 'IW3_AUTHENTIC_BOOTSTRAP_AGGREGATE_COMPILE_PASS'
          echo 'IW3_PLAYABLE_APK=false'
      - name: Audit ARM64 original-object unresolved symbols (NOT a link or game)
        shell: bash
        run: |
          set -euo pipefail
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          test -x "$nm"
          mapfile -d '' objects < <(find "$RUNNER_TEMP/iw3-bootstrap-build" -type f -name '*.o' -print0)
          test "${#objects[@]}" -ge 8
          "$nm" --undefined-only --format=posix "${objects[@]}" > "$RUNNER_TEMP/bootstrap-undefined-raw.txt"
          "$nm" --defined-only --format=posix "${objects[@]}" > "$RUNNER_TEMP/bootstrap-defined-raw.txt"
          python3 - "$RUNNER_TEMP" <<'PY'
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          def symbols(filename):
              found = set()
              for line in (root / filename).read_text(errors="replace").splitlines():
                  parts = line.split()
                  if len(parts) >= 2 and parts[1] in ("U", "T", "t", "W", "w", "D", "d", "B", "b", "R", "r", "V", "v"):
                      found.add(parts[0])
              return found
          unresolved = sorted(symbols("bootstrap-undefined-raw.txt") - symbols("bootstrap-defined-raw.txt"))
          output = root / "bootstrap-unresolved-symbols.txt"
          output.write_text(
              "IW3 ORIGINAL ARM64 OBJECT-ONLY LINK GAP; NOT A LINKED ENGINE OR APK\n"
              + f"Unresolved unique symbols: {len(unresolved)}\n"
              + "\n".join(unresolved) + "\n"
          )
          print(f"IW3_BOOTSTRAP_UNRESOLVED_UNIQUE={len(unresolved)}")
          print("IW3_PLAYABLE_APK=false")
          PY
      - name: Preserve compiler diagnostics (NOT APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iw3-authentic-bootstrap-aggregate-compile-log-NOT-APK
          path: |
            ${{ runner.temp }}/bootstrap-build.log
            ${{ runner.temp }}/bootstrap-undefined-raw.txt
            ${{ runner.temp }}/bootstrap-defined-raw.txt
            ${{ runner.temp }}/bootstrap-unresolved-symbols.txt
          if-no-files-found: warn
          retention-days: 30
