name: IW3 COD4 weapon arsenal proof (metadata only)

on:
  push:
    branches:
      - feature/iw3-arsenal-extraction-audit-20261102
    paths:
      - '.github/workflows/iw3-weapon-arsenal-gauntlet.yml'
      - 'tools/iw3_weapon_probe.py'
      - 'tools/iw3_arsenal_detail.py'
      - 'tools/iw3_anim_rig_gate.py'
      - 'tools/iw3_xanim_v17.py'
      - 'tools/iw3_anim_correlation.py'
      - 'tools/iw3_gltf_animation_bridge.py'
      - 'tools/iw3_build_animated_previews.py'
      - 'tools/iw3_stage_weapon_textures.py'
      - 'tools/iw3_png_materials.py'
      - 'tools/iw3_keyframe_variation.py'
      - 'tools/godot_iw3_import_probe.gd'
      - 'tools/godot_iw3_pose_probe.gd'
      - 'tools/iw3_fps_weapon_mount.gd'
      - 'tools/godot_iw3_mount_probe.gd'
      - 'tools/godot_iw3_render_probe.gd'
      - 'tools/godot_iw3_fps_camera_probe.gd'
      - 'tools/godot_iw3_ads_calibration_probe.gd'
      - 'tools/iw3_fps_weapon_controller.gd'
      - 'tools/godot_iw3_mobile_controller_probe.gd'
      - 'tools/iw3_fps_playground.gd'
      - 'tools/iw3_fps_playground.tscn'
      - 'tools/godot_iw3_fps_playground_probe.gd'
      - 'tools/godot_iw3_roll_orientation_probe.gd'
      - 'tools/godot_iw3_real_geometry_axis_probe.gd'
      - 'tools/godot_iw3_private_visual_capture.gd'
      - 'tools/godot_iw3_live_roll_v4_probe.gd'
      - 'tools/iw3_make_private_godot_lab.py'
      - 'tools/iw3_private_apk_crypt.py'
      - 'tools/iw3_private_transfer_public.pem'
      - 'tools/iw3_make_android_safe_project.py'
      - 'tools/godot_iw3_config_android.gd'
      - 'tests/test_iw3_weapon_probe.py'
      - 'tests/test_iw3_arsenal_detail.py'
      - 'tests/test_iw3_anim_rig_gate.py'
      - 'tests/test_iw3_xanim_decoder.py'
      - 'tests/test_iw3_gltf_animation_bridge.py'
      - 'tests/test_iw3_stage_weapon_textures.py'
      - 'docs/audit/IW3_WEAPON_ARSENAL_GATE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iw3-weapon-arsenal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python syntax and synthetic GLB/rig tests
        run: |
          set -euo pipefail
          python3 -m py_compile tools/iw3_weapon_probe.py tools/iw3_arsenal_detail.py tests/test_iw3_weapon_probe.py tests/test_iw3_arsenal_detail.py
          python3 -m unittest discover -s tests -p 'test_iw3_weapon_probe.py' -v
          python3 -m unittest discover -s tests -p 'test_iw3_arsenal_detail.py' -v
          python3 -m unittest discover -s tests -p 'test_iw3_anim_rig_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_iw3_xanim_decoder.py' -v
          python3 -m unittest discover -s tests -p 'test_iw3_gltf_animation_bridge.py' -v
          python3 -m unittest discover -s tests -p 'test_iw3_stage_weapon_textures.py' -v

  real-archive-smoke:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure OpenAssetTools 32-bit Linux runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libc6-i386 lib32stdc++6 xvfb libgl1-mesa-dri libglx-mesa0

      - name: Install pinned official OpenAssetTools v0.34.0
        run: |
          set -euo pipefail
          mkdir -p _oat
          curl --fail --location --retry 3 --output /tmp/oat-linux.tar.gz \
            https://github.com/Laupetin/OpenAssetTools/releases/download/v0.34.0/oat-linux.tar.gz
          tar -xzf /tmp/oat-linux.tar.gz -C _oat
          BIN="$(find _oat -type f -name Unlinker -print -quit)"
          test -n "$BIN"
          chmod +x "$BIN"
          test -f _oat/ImageConverter
          chmod +x _oat/ImageConverter
          file "$BIN"
          "$BIN" --version
          echo "UNLINKER=$PWD/$BIN" >> "$GITHUB_ENV"

      - name: Retrieve user's COD4 source archive privately inside runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p _release_assets/c4
          gh release download gofile-p2DdQHsz --repo "$GITHUB_REPOSITORY" \
            --pattern 'C4-Mocs.zip.part-*' --dir _release_assets/c4
          echo 'Checking original 7GB split ZIP SHA-256 without reconstructing another copy'
          actual="$(cat _release_assets/c4/C4-Mocs.zip.part-* | sha256sum | cut -d' ' -f1)"
          test "$actual" = '6787f2082b39ee76445db7fca92892256bfb97e62bbdebfe63f6ee11de6a8d99'

      - name: Stage only 2 FF zones and 2 IWDs, never the whole installation
        run: |
          set -euo pipefail
          python3 tools/iw3_weapon_probe.py prepare --with-iwds
          # Keep the original archive read-only until all needed textures are resolved.
          df -h .

      - name: Unlinker list and GLB export probe, M4 AK-47 MP5 and viewhands
        run: |
          set -euo pipefail
          python3 tools/iw3_weapon_probe.py probe --unlinker "$UNLINKER"
          python3 tools/iw3_arsenal_detail.py _iw3_private/dumps _iw3_reports/arsenal-detail.json
          python3 tools/iw3_anim_rig_gate.py _iw3_private/dumps _iw3_reports/animation-gate.json
          python3 tools/iw3_anim_correlation.py _iw3_private/dumps _iw3_reports/bone-correlation.json
          python3 tools/iw3_build_animated_previews.py _iw3_private/dumps _iw3_private/animated_preview _iw3_reports/animated-glb-gate.json
          python3 tools/iw3_keyframe_variation.py _iw3_private/animated_preview _iw3_reports/keyframe-variation.json

      - name: Restore temporary weapon textures (IWD/IWI -> DDS) for material imports
        run: |
          set -euo pipefail
          python3 tools/iw3_stage_weapon_textures.py _iw3_private "$PWD/_oat/ImageConverter" _iw3_reports/texture-gate.json
          rm -rf _release_assets

      - name: Convert DDS to portable PNG and repoint private animated GLBs
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet --target _iw3_private/python_deps Pillow==12.0.0
          PYTHONPATH="$PWD/_iw3_private/python_deps" python3 tools/iw3_png_materials.py \
            _iw3_private/godot_sandbox/images \
            _iw3_private/animated_preview \
            _iw3_reports/png-materials.json

      - name: Install official Godot 4.6.3 and import 3 temporary animated GLBs
        run: |
          set -euo pipefail
          mkdir -p _iw3_private/godot_sandbox/weapons _iw3_private/godot_bin
          test "$(find _iw3_private/animated_preview -maxdepth 1 -name '*_animated_experimental.glb' | wc -l)" -eq 6
          cp _iw3_private/animated_preview/*_animated_experimental.glb _iw3_private/godot_sandbox/weapons/
          cp tools/godot_iw3_import_probe.gd _iw3_private/godot_sandbox/import_probe.gd
          cp tools/godot_iw3_pose_probe.gd _iw3_private/godot_sandbox/pose_probe.gd
          cp tools/iw3_fps_weapon_mount.gd _iw3_private/godot_sandbox/weapon_mount.gd
          cp tools/godot_iw3_mount_probe.gd _iw3_private/godot_sandbox/mount_probe.gd
          cp tools/godot_iw3_render_probe.gd _iw3_private/godot_sandbox/render_probe.gd
          cp tools/godot_iw3_fps_camera_probe.gd _iw3_private/godot_sandbox/fps_camera_probe.gd
          cp tools/godot_iw3_ads_calibration_probe.gd _iw3_private/godot_sandbox/ads_calibration_probe.gd
          cp tools/iw3_fps_weapon_controller.gd _iw3_private/godot_sandbox/fps_controller.gd
          cp tools/godot_iw3_mobile_controller_probe.gd _iw3_private/godot_sandbox/mobile_controller_probe.gd
          cp tools/iw3_fps_playground.gd _iw3_private/godot_sandbox/playground.gd
          cp tools/iw3_fps_playground.tscn _iw3_private/godot_sandbox/playground.tscn
          cp tools/godot_iw3_fps_playground_probe.gd _iw3_private/godot_sandbox/playground_probe.gd
          cp tools/godot_iw3_roll_orientation_probe.gd _iw3_private/godot_sandbox/roll_probe.gd
          cp tools/godot_iw3_live_roll_v4_probe.gd _iw3_private/godot_sandbox/live_roll_v4_probe.gd
          cp tools/godot_iw3_real_geometry_axis_probe.gd _iw3_private/godot_sandbox/geometry_axis_probe.gd
          cat > _iw3_private/godot_sandbox/project.godot <<'INI'
          config_version=5
          [application]
          config/name="COD4 IW3 Animated GLB Import Gate"
          run/main_scene="res://playground.tscn"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          INI
          curl --fail --location --retry 3 \
            --output /tmp/godot-4.6.3-linux.zip \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot-4.6.3-linux.zip -d _iw3_private/godot_bin
          BIN="$(find _iw3_private/godot_bin -type f -name 'Godot*' -print -quit)"
          test -n "$BIN"
          chmod +x "$BIN"
          "$BIN" --version
          "$BIN" --headless --editor --path _iw3_private/godot_sandbox --import
          "$BIN" --headless --path _iw3_private/godot_sandbox \
            --script res://import_probe.gd
          cp _iw3_private/godot_sandbox/godot-import-gate.json _iw3_reports/godot-import-gate.json
          "$BIN" --headless --path _iw3_private/godot_sandbox \
            --script res://pose_probe.gd
          cp _iw3_private/godot_sandbox/godot-pose-gate.json _iw3_reports/godot-pose-gate.json
          "$BIN" --headless --path _iw3_private/godot_sandbox \
            --script res://mount_probe.gd
          cp _iw3_private/godot_sandbox/godot-mount-gate.json _iw3_reports/godot-mount-gate.json
          "$BIN" --headless --path _iw3_private/godot_sandbox \
            --script res://ads_calibration_probe.gd
          cp _iw3_private/godot_sandbox/godot-ads-solver-gate.json _iw3_reports/godot-ads-solver-gate.json
          "$BIN" --headless --path _iw3_private/godot_sandbox \
            --script res://mobile_controller_probe.gd
          cp _iw3_private/godot_sandbox/godot-mobile-controller-gate.json _iw3_reports/godot-mobile-controller-gate.json
          "$BIN" --headless --path _iw3_private/godot_sandbox \
            --script res://playground_probe.gd
          cp _iw3_private/godot_sandbox/godot-fps-playground-gate.json _iw3_reports/godot-fps-playground-gate.json
          "$BIN" --headless --path _iw3_private/godot_sandbox \
            --script res://roll_probe.gd
          cp _iw3_private/godot_sandbox/godot-viewmodel-roll-gate.json _iw3_reports/godot-viewmodel-roll-gate.json
          "$BIN" --headless --path _iw3_private/godot_sandbox \
            --script res://live_roll_v4_probe.gd
          cp _iw3_private/godot_sandbox/godot-live-roll-v4-gate.json _iw3_reports/godot-live-roll-v4-gate.json
          "$BIN" --headless --path _iw3_private/godot_sandbox \
            --script res://geometry_axis_probe.gd
          cp _iw3_private/godot_sandbox/godot-geometry-axis-sweep.json _iw3_reports/godot-geometry-axis-sweep.json
          python3 tools/iw3_make_private_godot_lab.py --private-root _iw3_private --output _iw3_private/fps_lab --scripts tools
          "$BIN" --headless --editor --path _iw3_private/fps_lab --import
          xvfb-run -a -s '-screen 0 1280x720x24' "$BIN" --rendering-driver opengl3 \
            --path _iw3_private/fps_lab --quit-after 100
          echo 'Private Godot FPS lab main scene launched; no copyrighted assets published.'
          xvfb-run -a -s '-screen 0 1024x768x24' "$BIN" --rendering-driver opengl3 \
            --path _iw3_private/godot_sandbox --script res://render_probe.gd
          cp _iw3_private/godot_sandbox/godot-render-gate.json _iw3_reports/godot-render-gate.json
          xvfb-run -a -s '-screen 0 1024x768x24' "$BIN" --rendering-driver opengl3 \
            --path _iw3_private/godot_sandbox --script res://fps_camera_probe.gd
          cp _iw3_private/godot_sandbox/godot-fps-camera-gate.json _iw3_reports/godot-fps-camera-gate.json

      - name: PRIVATE real-COD4 render screenshots in Xvfb, then encrypt before artifact upload
        run: |
          set -euo pipefail
          cp tools/godot_iw3_private_visual_capture.gd _iw3_private/godot_sandbox/private_capture.gd
          BIN="$(find _iw3_private/godot_bin -type f -name 'Godot*' -print -quit)"
          test -x "$BIN"
          xvfb-run -a -s '-screen 0 1280x720x24' "$BIN" --rendering-driver opengl3 \
            --path _iw3_private/godot_sandbox --script res://private_capture.gd
          test "$(find _iw3_private/godot_sandbox/private_frames -name '*.png' | wc -l)" -eq 30
          mkdir -p _iw3_secure_handoff
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          base=Path("_iw3_private/godot_sandbox/private_frames")
          target=Path("_iw3_private/IW3_PRIVATE_VISUAL_AUDIT.zip")
          with ZipFile(target,"x",compression=ZIP_DEFLATED) as z:
              for file in sorted(base.iterdir()):
                  if file.is_file() and file.suffix.lower() in {".png",".json"}:
                      z.write(file,arcname=file.name)
          assert target.stat().st_size > 10000, "Private screenshots absent"
          print("PRIVATE_COD4_VISUAL_ZIP_CREATED=1; plaintext will NOT upload")
          PY
          python3 -m pip install --disable-pip-version-check --quiet --target _iw3_private/cryptodeps cryptography==46.0.3
          PYTHONPATH="$PWD/_iw3_private/cryptodeps" python3 tools/iw3_private_apk_crypt.py seal \
            _iw3_private/IW3_PRIVATE_VISUAL_AUDIT.zip \
            _iw3_secure_handoff/IW3_PRIVATE_VISUAL_AUDIT.iw3sealed \
            tools/iw3_private_transfer_public.pem
          test -s _iw3_secure_handoff/IW3_PRIVATE_VISUAL_AUDIT.iw3sealed
          rm -rf _iw3_private/godot_sandbox/private_frames _iw3_private/IW3_PRIVATE_VISUAL_AUDIT.zip
          echo 'PRIVATE_VISUALS_ENCRYPTED; no raw screenshots in public artifacts'

      - name: Upload only encrypted real-weapon visual diagnostic (NO raw PNG/ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: IW3_REAL_WEAPONS_PRIVATE_VISUAL_AUDIT_ENCRYPTED
          path: _iw3_secure_handoff/IW3_PRIVATE_VISUAL_AUDIT.iw3sealed
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

      - name: Set up Java 17 for private Android debug export
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (no proprietary assets are uploaded)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Godot 4.6.3 Android export SDK and templates
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35' 'cmdline-tools;latest' 'ndk;28.1.13356709'
          curl --fail --location --retry 3 --output /tmp/iw3-godot-android-templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -p /tmp/iw3-godot-android-templates.tpz templates/android_debug.apk > "$HOME/.local/share/godot/export_templates/4.6.3.stable/android_debug.apk"
          unzip -p /tmp/iw3-godot-android-templates.tpz templates/android_release.apk > "$HOME/.local/share/godot/export_templates/4.6.3.stable/android_release.apk"
          echo '4.6.3.stable' > "$HOME/.local/share/godot/export_templates/4.6.3.stable/version.txt"
          test -s "$HOME/.local/share/godot/export_templates/4.6.3.stable/android_debug.apk"
          rm -f /tmp/iw3-godot-android-templates.tpz

      - name: Create ephemeral debug signing identity and configure Godot
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/iw3-private-debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 2500 \
            -dname 'CN=ZOMBIES IW3 PRIVATE TEST,O=Development,C=US' > /dev/null
          cp tools/godot_iw3_config_android.gd _iw3_private/fps_lab/config_android.gd
          BIN="$(find _iw3_private/godot_bin -type f -name 'Godot*' -print -quit)"
          test -x "$BIN"
          "$BIN" --headless --editor --path _iw3_private/fps_lab --script res://config_android.gd

      - name: Export private Android ARM64 APK with REAL M4 AK47 MP5 and original hands
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/iw3-private-debug.keystore"
          BIN="$(find _iw3_private/godot_bin -type f -name 'Godot*' -print -quit)"
          test "$(find _iw3_private/fps_lab/weapons -maxdepth 1 -name '*_animated_experimental.glb' | wc -l)" -eq 6
          test "$(find _iw3_private/fps_lab/images -maxdepth 1 -name '*.png' | wc -l)" -ge 16
          python3 - <<'PY'
          from pathlib import Path
          root=Path('_iw3_private/fps_lab')
          for gun in ['m4','ak47','mp5']:
              for suffix in ['_animated_experimental.glb','_hands_animated_experimental.glb']:
                  assert (root/'weapons'/(gun+suffix)).stat().st_size > 500
          assert (root/'project.godot').exists()
          assert (root/'export_presets.cfg').exists()
          print('REAL_IW3_PRIVATE_EXPORT_INPUT: 3 guns + 3 viewhands + 16 textures present')
          PY
          "$BIN" --headless --editor --path _iw3_private/fps_lab --import
          "$BIN" --headless --path _iw3_private/fps_lab \
            --export-debug 'Android' build/ZOMBIES_IW3_ORIGINAL_ARM64.apk
          APK=_iw3_private/fps_lab/build/ZOMBIES_IW3_ORIGINAL_ARM64.apk
          test -s "$APK"
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK" | head -10
          echo 'PRIVATE_IW3_ARM64_APK_BUILT=1'
          sha256sum "$APK"

      - name: Seal original gun APK with recipient-only AES-GCM before artifact upload
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet --target _iw3_private/cryptodeps cryptography==46.0.3
          mkdir -p _iw3_secure_handoff
          PYTHONPATH="$PWD/_iw3_private/cryptodeps" python3 tools/iw3_private_apk_crypt.py seal \
            _iw3_private/fps_lab/build/ZOMBIES_IW3_ORIGINAL_ARM64.apk \
            _iw3_secure_handoff/ZOMBIES_IW3_ORIGINAL_ARM64.iw3sealed \
            tools/iw3_private_transfer_public.pem
          test -s _iw3_secure_handoff/ZOMBIES_IW3_ORIGINAL_ARM64.iw3sealed
          # The plaintext file must NOT appear in any public artifact.
          rm -f _iw3_private/fps_lab/build/ZOMBIES_IW3_ORIGINAL_ARM64.apk
          echo 'ONLY ENCRYPTED CONTENT IS ELIGIBLE FOR UPLOAD'

      - name: Upload encrypted private APK only (no original game data publicly readable)
        uses: actions/upload-artifact@v4
        with:
          name: IW3_OWNER_ONLY_AES256GCM_ARMORED_APK
          path: _iw3_secure_handoff/ZOMBIES_IW3_ORIGINAL_ARM64.iw3sealed
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

      - name: Archive ONLY metadata and safe audit results (no extracted game files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iw3-cod4-weapon-probe-metadata
          path: |
            _iw3_reports/staging.json
            _iw3_reports/results.json
            _iw3_reports/arsenal-detail.json
            _iw3_reports/animation-gate.json
            _iw3_reports/bone-correlation.json
            _iw3_reports/animated-glb-gate.json
            _iw3_reports/godot-import-gate.json
            _iw3_reports/godot-pose-gate.json
            _iw3_reports/godot-mount-gate.json
            _iw3_reports/godot-render-gate.json
            _iw3_reports/godot-fps-camera-gate.json
            _iw3_reports/godot-ads-solver-gate.json
            _iw3_reports/godot-mobile-controller-gate.json
            _iw3_reports/godot-fps-playground-gate.json
            _iw3_reports/godot-viewmodel-roll-gate.json
            _iw3_reports/godot-live-roll-v4-gate.json
            _iw3_reports/godot-geometry-axis-sweep.json
            _iw3_reports/png-materials.json
            _iw3_reports/texture-gate.json
          retention-days: 14
          if-no-files-found: warn

      - name: Destroy all temporary game files and tool binaries
        if: always()
        run: |
          rm -rf _release_assets _iw3_private _oat _iw3_secure_handoff
          echo 'Game archive and extracted weapon assets not committed or uploaded.'
