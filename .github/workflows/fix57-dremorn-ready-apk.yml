name: FIX57 Dremorn visual bridge APK (NO proprietary 3D model included)
on:
  push:
    branches: [feature/fix57-dremorn-optional-visual-loader-20261113]
    paths:
      - '.github/workflows/fix57-dremorn-ready-apk.yml'
      - 'incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/dremorn_visual.lua'
      - 'incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/init.lua'
      - 'incoming/luanti-fix50b/tests/test_fix57_dremorn_visual.lua'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  fix57-signed-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Test native AI and optional Dremorn bridge (original media absent)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          MOD=incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic
          for f in "$MOD"/*.lua; do luac5.4 -p "$f"; done
          lua5.4 incoming/luanti-fix50b/tests/test_fix57_dremorn_visual.lua
          python3 -m unittest incoming/luanti-fix50b/tests/test_fix57_dremorn_glb_preflight.py -v
          lua5.4 incoming/luanti-fix50b/tests/test_fix55_rotu_bot_ai.lua
          lua5.4 incoming/luanti-fix50b/tests/test_v26_original.lua
          lua5.4 incoming/luanti-fix50b/tests/test_fix53_chase_sizes.lua
          lua5.4 incoming/luanti-fix50b/tests/test_fix54_original_viril_combatfx.lua
          lua5.4 incoming/luanti-fix50b/tests/test_runtime.lua
      - name: Restore complete signed FIX56 base without changing 28 weapons or fonts
        uses: actions/download-artifact@v4
        with:
          run-id: 43406119721
          artifact-ids: 14026539997
          github-token: ${{ github.token }}
          path: fix57-base
          merge-multiple: true
      - name: Package OPTIONAL FIX57 animation bridge only
        run: |
          set -euo pipefail
          mkdir -p fix57-build/overlay
          cp incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/dremorn_visual.lua fix57-build/overlay/
          test -s fix57-base/COD4-ZOMBIES-FIX56-NATIVE-LIVE-CHASE-ARM64.apk
          test ! -e incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/models/xz_dremorn_zombie.glb
          test ! -e incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/textures/xz_dremorn_body.png
          python3 incoming/luanti-fix50b/build_playable_test.py \
            --fix49c fix57-base/COD4-ZOMBIES-FIX56-NATIVE-LIVE-CHASE-ARM64.apk \
            --rebuilt fix57-base/COD4-ZOMBIES-FIX56-NATIVE-LIVE-CHASE-ARM64.apk \
            --lua incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/init.lua \
            --overlay-dir fix57-build/overlay \
            --output fix57-build/unsigned.apk
      - name: Deep check original files and license-safe media packaging
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,lzma,io,json,pathlib
          original=pathlib.Path('fix57-base/COD4-ZOMBIES-FIX56-NATIVE-LIVE-CHASE-ARM64.apk')
          candidate=pathlib.Path('fix57-build/unsigned.apk')
          root='games/voxelibre/mods/xz_zombies_classic/'
          expected={root+'init.lua':'replaced',root+'dremorn_visual.lua':'added'}
          report=json.loads(pathlib.Path('fix57-build/packaging_report.json').read_text())
          assert report['assets']['baseline_asset_count']==9716
          assert report['assets']['candidate_asset_count']==9717
          assert report['assets']['changed']==expected,report['assets']['changed']
          with zipfile.ZipFile(original) as a, zipfile.ZipFile(candidate) as b:
            for entry in a.infolist():
              if entry.filename=='assets/assets.zip' or entry.filename.startswith('META-INF/'):continue
              counterpart=b.getinfo(entry.filename)
              assert (entry.CRC,entry.file_size)==(counterpart.CRC,counterpart.file_size),entry.filename
            assert a.read('lib/arm64-v8a/libluanti.so')==b.read('lib/arm64-v8a/libluanti.so')
            for apk,label in [(a,'before'),(b,'after')]:
              with zipfile.ZipFile(io.BytesIO(apk.read('assets/assets.zip'))) as outer:
                with zipfile.ZipFile(io.BytesIO(lzma.decompress(outer.read('luanti-assets.zip.xz')))) as inner:
                  assert len(inner.namelist()) == (9716 if label=='before' else 9717)
                  if label=='before':
                    before={x.filename:(x.CRC,x.file_size) for x in inner.infolist()}
                  else:
                    for x in inner.infolist():
                      if x.filename in expected:continue
                      assert (x.CRC,x.file_size)==before[x.filename],x.filename
                    assert b'dremorn_visual.apply' in inner.read(root+'init.lua')
                    assert b'play_animation' in inner.read(root+'dremorn_visual.lua')
                    assert not any('dremorn_zombie.glb' in x or 'dremorn_body.png' in x for x in inner.namelist()), 'External art must not ship'
          print('PASS: all 28 guns, sound, control, AI, fonts, v26, barricades preserved; no licensed art included')
          PY
      - name: Sign independent Android developer test APK
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/zipalign" -f -p 4 fix57-build/unsigned.apk fix57-build/aligned.apk
          keytool -genkeypair -keystore "$RUNNER_TEMP/fix57.jks" -alias fix57 \
            -storepass android -keypass android -keyalg RSA -keysize 3072 -validity 3650 -noprompt \
            -dname 'CN=FIX57 Optional Dremorn Bridge Dev Test,OU=Development,O=Xziel,C=US'
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/fix57.jks" --ks-key-alias fix57 \
            --ks-pass pass:android --key-pass pass:android \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out fix57-build/COD4-ZOMBIES-FIX57-DREMORN-BRIDGE-NO-MODEL-ARM64.apk fix57-build/aligned.apk
          "$TOOLS/apksigner" verify --verbose fix57-build/COD4-ZOMBIES-FIX57-DREMORN-BRIDGE-NO-MODEL-ARM64.apk
          "$TOOLS/aapt" dump badging fix57-build/COD4-ZOMBIES-FIX57-DREMORN-BRIDGE-NO-MODEL-ARM64.apk | tee fix57-build/badging.txt
          grep -q "package: name='com.xziel.zombies.fix50btest' versionCode='5180055'" fix57-build/badging.txt
          unzip -t fix57-build/COD4-ZOMBIES-FIX57-DREMORN-BRIDGE-NO-MODEL-ARM64.apk >/dev/null
          sha256sum fix57-build/COD4-ZOMBIES-FIX57-DREMORN-BRIDGE-NO-MODEL-ARM64.apk | tee fix57-build/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FIX57-DREMORN-VISUAL-BRIDGE-NO-MODEL-ARM64
          path: |
            fix57-build/COD4-ZOMBIES-FIX57-DREMORN-BRIDGE-NO-MODEL-ARM64.apk
            fix57-build/packaging_report.json
            fix57-build/badging.txt
            fix57-build/sha256.txt
          if-no-files-found: error
          retention-days: 14
