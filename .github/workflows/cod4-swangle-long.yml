name: COD4 SwANGLE extended level render check
on:
  push:
    paths:
      - '.github/workflows/cod4-swangle-long.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extend-swangle:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Obtain existing test data only in temporary runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p _release_assets/c4 _release_assets/cod4
          gh release download gofile-p2DdQHsz --repo "$GITHUB_REPOSITORY" --pattern 'C4-Mocs.zip.part-*' --dir _release_assets/c4
          gh release download mediafire-COD4-apk --repo "$GITHUB_REPOSITORY" --pattern 'COD4.apk' --dir _release_assets/cod4
          echo '40386503d564b0985423339b5ccd5611dc60ce08ebe1b4ae494d4de22a62473c  _release_assets/cod4/COD4.apk' | sha256sum --check
          python3 tools/prepare_cod4_core_fixture.py
      - name: Prepare diagnostics
        run: |
          python3 -m venv /tmp/cod4-swangle
          /tmp/cod4-swangle/bin/pip --disable-pip-version-check install --quiet 'Pillow>=10,<13'
          /tmp/cod4-swangle/bin/python -m py_compile tools/probe_swangle_extended.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native Android port and inspect prolonged SwANGLE render
        uses: reactivecircus/android-emulator-runner@v2
        env:
          COD4_RENDER_DIAG_ONLY: '1'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 3072M
          disk-size: 16384M
          force-avd-creation: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -e
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb install -r _release_assets/cod4/COD4.apk
            /tmp/cod4-swangle/bin/python tools/test_android_source_import.py
            /tmp/cod4-swangle/bin/python tools/probe_swangle_extended.py
      - name: Upload diagnostics only; no original game binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cod4-swangle-extended-evidence
          path: |
            smoke-out/real-data-test/*.png
            smoke-out/real-data-test/result.json
            smoke-out/real-data-test/renderer-diagnostic.json
            smoke-out/real-data-test/swangle-extended-report.json
            smoke-out/real-data-test/swangle-extended-*-meminfo.txt
            smoke-out/real-data-test/runtime-filtered-logcat.txt
          retention-days: 14
          if-no-files-found: warn
      - name: Remove temporary game inputs
        if: always()
        run: |
          rm -rf _runtime_temp _release_assets
          echo 'Source binaries removed; not retained in git or artifacts.'
