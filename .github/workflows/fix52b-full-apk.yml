name: FIX52B COD Zombies actual bullet hits, survival and mobile HUD ARM64
on:
  push:
    branches: [fix/fix52b-v26-safe-damage-cod-hud-20261112]
    paths:
      - '.github/workflows/fix52b-full-apk.yml'
      - 'incoming/luanti-fix50b/build_playable_test.py'
      - 'incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/**'
      - 'incoming/luanti-fix50b/tests/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fix52b-full-signed-arm64
  cancel-in-progress: false
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Test VoxeLibre survival damage, original v26 mechanics, native guns and hit HUD
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          for script in incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/*.lua; do
            luac5.4 -p "$script"
          done
          python3 -m py_compile incoming/luanti-fix50b/build_playable_test.py
          lua5.4 incoming/luanti-fix50b/tests/test_v26_original.lua
          lua5.4 incoming/luanti-fix50b/tests/test_fix52b_hud_modes.lua
          lua5.4 incoming/luanti-fix50b/tests/test_runtime.lua
      - name: Download FIX52 original NZP v26 APK without rebuilding native weapons
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p fix52b-input fix52b-build/overlay
          gh release download fix52-original-v26-zombies-port-arm64-playtest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern COD4-ZOMBIES-FIX52-ORIGINAL-V26-PORT-ARM64.apk \
            --dir fix52b-input
          test -s fix52b-input/COD4-ZOMBIES-FIX52-ORIGINAL-V26-PORT-ARM64.apk
      - name: Stage only the true v26 mechanics and compact COD HUD
        run: |
          cp incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/v26_runtime.lua fix52b-build/overlay/v26_runtime.lua
          cp incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/v26_modes.lua fix52b-build/overlay/v26_modes.lua
          cp incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/v26_hud.lua fix52b-build/overlay/v26_hud.lua
          test "$(find fix52b-build/overlay -type f | wc -l)" -eq 3
      - name: Repack exact FIX52 native Android binary with guarded COD4 per-impact hook
        run: |
          set -euo pipefail
          python3 incoming/luanti-fix50b/build_playable_test.py \
            --fix49c fix52b-input/COD4-ZOMBIES-FIX52-ORIGINAL-V26-PORT-ARM64.apk \
            --rebuilt fix52b-input/COD4-ZOMBIES-FIX52-ORIGINAL-V26-PORT-ARM64.apk \
            --lua incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/init.lua \
            --overlay-dir fix52b-build/overlay \
            --cod4-hit-hook \
            --output fix52b-build/unsigned.apk
      - name: Strict verify 9684 game resources, identical native COD4 engine and unchanged guns
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io,zipfile,lzma,pathlib,json
          base=pathlib.Path('fix52b-input/COD4-ZOMBIES-FIX52-ORIGINAL-V26-PORT-ARM64.apk')
          new=pathlib.Path('fix52b-build/unsigned.apk')
          report=json.loads(pathlib.Path('fix52b-build/packaging_report.json').read_text())
          assert report['assets']['baseline_asset_count']==9682, report
          assert report['assets']['candidate_asset_count']==9684, report
          mod='games/voxelibre/mods/xz_zombies_classic/'
          combat='games/voxelibre/mods/ak47dev/combat.lua'
          expected={mod+'init.lua':'replaced',mod+'v26_runtime.lua':'replaced',
            mod+'v26_modes.lua':'added',mod+'v26_hud.lua':'added',
            combat:'replaced'}
          assert report['assets']['changed']==expected,report['assets']['changed']
          with zipfile.ZipFile(base) as old,zipfile.ZipFile(new) as apk:
            for item in old.infolist():
              if item.filename=='assets/assets.zip' or item.filename.startswith('META-INF/'):
                continue
              actual=apk.getinfo(item.filename)
              assert (item.CRC,item.file_size)==(actual.CRC,actual.file_size),'Modified original APK file: '+item.filename
            for key in ('lib/arm64-v8a/libluanti.so','classes.dex','AndroidManifest.xml','resources.arsc'):
              assert old.read(key)==apk.read(key),'Original COD4 engine/Android app changed: '+key
            with zipfile.ZipFile(io.BytesIO(apk.read('assets/assets.zip'))) as outer:
              assert outer.comment==b'XZ-ASSETS-1:9684',outer.comment
              with zipfile.ZipFile(io.BytesIO(lzma.decompress(outer.read('luanti-assets.zip.xz')))) as z:
                assert len(z.namelist())==9684
                luac=z.read(mod+'init.lua')
                assert b'on_cod4_impact=cod4_post_impact' in luac
                assert b'v26_modes.play(p)' in luac and b'v26_modes.stop(p)' in luac
                assert b"'mobs_mc:baby_zombie'" not in luac
                code=z.read(combat).decode('utf8')
                assert code.count('target:punch(shooter,1,')==1
                assert code.count('api.on_cod4_impact(shooter,target,v26_before,v26_after)')==1
                for k in (mod+'v26_modes.lua',mod+'v26_hud.lua',mod+'models/nzp_v26_window_6.obj',
                          mod+'v26_rules.lua',mod+'sounds/nzp_v26_barricade.ogg',
                          'fonts/Arimo-Regular.ttf','textures/base/pack/xz_use_btn.png'):
                  assert len(z.read(k))>0,k
          print('PASS: 9684 game assets, native engine identical, 28 guns intact, original model sound & USE preserved')
          PY
      - name: Align sign verify and hash developer test APK
        run: |
          set -euo pipefail
          TOOLSDIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLSDIR/zipalign" -f -p 4 fix52b-build/unsigned.apk fix52b-build/aligned.apk
          keytool -genkeypair -keystore "$RUNNER_TEMP/fix52b.jks" -alias fix52b \
            -storepass android -keypass android -keyalg RSA -keysize 3072 \
            -validity 3650 -noprompt \
            -dname 'CN=Zombies FIX52B Playtest,OU=Development,O=Xziel,C=US'
          "$TOOLSDIR/apksigner" sign --ks "$RUNNER_TEMP/fix52b.jks" \
            --ks-key-alias fix52b --ks-pass pass:android --key-pass pass:android \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out fix52b-build/COD4-ZOMBIES-FIX52B-SURVIVAL-HITS-HUD-ARM64.apk \
            fix52b-build/aligned.apk
          "$TOOLSDIR/apksigner" verify --verbose fix52b-build/COD4-ZOMBIES-FIX52B-SURVIVAL-HITS-HUD-ARM64.apk
          "$TOOLSDIR/aapt" dump badging fix52b-build/COD4-ZOMBIES-FIX52B-SURVIVAL-HITS-HUD-ARM64.apk | tee fix52b-build/badging.txt
          grep -q "package: name='com.xziel.zombies.fix50btest'" fix52b-build/badging.txt
          unzip -t fix52b-build/COD4-ZOMBIES-FIX52B-SURVIVAL-HITS-HUD-ARM64.apk >/dev/null
          sha256sum fix52b-build/COD4-ZOMBIES-FIX52B-SURVIVAL-HITS-HUD-ARM64.apk | tee fix52b-build/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FIX52B-SURVIVAL-HITS-HUD-ARM64
          path: |
            fix52b-build/COD4-ZOMBIES-FIX52B-SURVIVAL-HITS-HUD-ARM64.apk
            fix52b-build/packaging_report.json
            fix52b-build/sha256.txt
            fix52b-build/badging.txt
          retention-days: 14
          if-no-files-found: error
      - name: Release FIX52B only after Lua, asset and native regression gates succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create fix52b-survival-cod4-hits-hud-arm64-playtest \
            fix52b-build/COD4-ZOMBIES-FIX52B-SURVIVAL-HITS-HUD-ARM64.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'FIX52B — v26 Zombies: safe mob hits, survival PLAY, +10 points per shot' \
            --notes 'VoxeLibre original mcl_damage reason fixed so zombie melee no longer crashes. PLAY switches per-player mcl_gamemode to survival and STOP restores creative. Original native COD4 projectile_hit applies same target:punch as prior version; one new post-impact callback awards source NZP v26 +10 nonfatal, +50 body fatal, etc., no duplicate point credit. Compact bottom round/remaining/points HUD displays rising +10/+50 cascade; avoids top pause/chat overlay. Original 6-plank NZP v26 model, texture, sound, repair points and wave scaling preserved. Native libluanti.so and Android binaries are byte-identical to FIX52; all 28 weapon files preserved except strictly guarded combat.lua hit callback. Same com.xziel.zombies.fix50btest APK package, disposable new signing key: BACK UP worlds, uninstall only old FIX50B/FIX51/FIX52 test build to install; KEEP FIX49C. Physical gameplay still requires device verification.'
