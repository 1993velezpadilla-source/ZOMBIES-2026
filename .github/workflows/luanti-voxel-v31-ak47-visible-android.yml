name: Build Voxel Sandbox V3.1 visible AK47 3D Android APK
on:
  push:
    branches:
      - feature/voxel-v31-ak47-visible-viewmodel-20261105
    paths:
      - sandbox/luanti/**
      - .github/workflows/luanti-voxel-v31-ak47-visible-android.yml
  workflow_dispatch:
permissions:
  contents: write

jobs:
  android-ak47:
    name: V3.1 native visible 3D gun plus AK GLB and CC0 reload
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout independent visible AK-47 fix
        uses: actions/checkout@v4

      - name: Install required gettext msgfmt and validate generated sources
        run: |
          sudo apt-get install -y --no-install-recommends gettext
          command -v msgfmt
          python3 -m py_compile sandbox/luanti/v3/build_ak47_assets.py sandbox/luanti/v3/patch_v3.py sandbox/luanti/v3/verify_v3.py sandbox/luanti/v31/build_wield_mesh.py sandbox/luanti/v31/patch_v31.py sandbox/luanti/v31/verify_v31.py
          if command -v luac5.1 >/dev/null; then luac5.1 -p sandbox/luanti/v3/ak47dev/init.lua; fi

      - name: Use Java 17 for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download pinned Luanti and original VoxeLibre
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 5.18.0 https://github.com/luanti-org/luanti.git "$RUNNER_TEMP/luanti"
          git clone --depth 1 --branch master https://github.com/VoxeLibre/VoxeLibre.git "$RUNNER_TEMP/voxelibre"
          test "$(git -C "$RUNNER_TEMP/voxelibre" rev-parse HEAD)" = "4492ce6ff8d856daa4567abe2ea689f4e7a39842"
          mkdir -p "$RUNNER_TEMP/luanti/games"
          mv "$RUNNER_TEMP/voxelibre" "$RUNNER_TEMP/luanti/games/voxelibre"
          rm -rf "$RUNNER_TEMP/luanti/games/voxelibre/.git"
          python3 "$GITHUB_WORKSPACE/sandbox/luanti/prepare.py" "$RUNNER_TEMP/luanti"
          python3 "$GITHUB_WORKSPACE/sandbox/luanti/v2/patch_v2.py" "$RUNNER_TEMP/luanti"
          python3 "$GITHUB_WORKSPACE/sandbox/luanti/v3/patch_v3.py" "$RUNNER_TEMP/luanti"
          python3 "$GITHUB_WORKSPACE/sandbox/luanti/v31/patch_v31.py" "$RUNNER_TEMP/luanti"
          python3 "$GITHUB_WORKSPACE/sandbox/luanti/v3/verify_v3.py" "$RUNNER_TEMP/luanti/games/voxelibre/mods/ak47dev"
          python3 "$GITHUB_WORKSPACE/sandbox/luanti/v31/verify_v31.py" "$RUNNER_TEMP/luanti/games/voxelibre/mods/ak47dev"
          if command -v luac5.1 >/dev/null; then luac5.1 -p "$RUNNER_TEMP/luanti/games/voxelibre/mods/ak47dev/init.lua"; fi

      - name: Compile separate V3.1 Android ARM64 APK (V1/V2/V3 unchanged)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/luanti/android"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify real APK contents and package
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/luanti/android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk"
          python3 sandbox/luanti/verify_apk.py "$APK"
          python3 sandbox/luanti/v2/verify_v2.py "$APK"
          python3 sandbox/luanti/v3/verify_v3.py "$APK"
          python3 sandbox/luanti/v31/verify_v31.py "$APK"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging "$APK" | grep -m1 "package:"
          "$AAPT" dump badging "$APK" | grep -q "name='com.xziel.voxelsandbox.v31'"
          mkdir -p "$RUNNER_TEMP/v3-dist"
          cp "$APK" "$RUNNER_TEMP/v3-dist/Voxel-Sandbox-V31-AK47-Visible-ARM64.apk"
          sha256sum "$RUNNER_TEMP/v3-dist/Voxel-Sandbox-V31-AK47-Visible-ARM64.apk"

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: Voxel-Sandbox-V31-AK47-Visible-3D-ARM64-APK
          path: ${{ runner.temp }}/v3-dist/Voxel-Sandbox-V31-AK47-Visible-ARM64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct test APK GitHub prerelease
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "voxel-sandbox-v31-ak47-visible-${GITHUB_RUN_NUMBER}" \
            "$RUNNER_TEMP/v3-dist/Voxel-Sandbox-V31-AK47-Visible-ARM64.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Voxel Sandbox V3.1 - Visible AK-47 in First Person ${GITHUB_RUN_NUMBER}" \
            --notes "Visible 3D AK fix; original V1, V2 and V3 preserved. Original 3D skinned GLB gun (body, curved magazine, bolt and hands), recoil and reload animations, AK-47 CC0 shot/reload/click from Deases/GunLib (Freesound CC0 sources), ADS, auto reload, 30 rounds; game uses VoxeLibre on Luanti. No Project Aether/ TaCZ copyrighted assets in APK. Requires real Android verification."
