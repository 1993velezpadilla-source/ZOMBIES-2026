name: FIX54 original Xziel Viril v26 yellow damage and instant COD4 hit score ARM64
on:
  push:
    branches: [feature/fix54-original-v26-quakec-vm-20261112]
    paths: ['.github/workflows/fix54-original-v26-hit-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fix54-original-viril-v26-hit-apk
  cancel-in-progress: false
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Verify original NZP v26 scoring, Xziel Viril C damage HUD and original 28 COD4 guns
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          for lua in incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/*.lua; do luac5.4 -p "$lua"; done
          lua5.4 incoming/luanti-fix50b/tests/test_v26_original.lua
          lua5.4 incoming/luanti-fix50b/tests/test_fix54_original_viril_combatfx.lua
          lua5.4 incoming/luanti-fix50b/tests/test_fix53_chase_sizes.lua
          lua5.4 incoming/luanti-fix50b/tests/test_fix52b_hud_modes.lua
          lua5.4 incoming/luanti-fix50b/tests/test_runtime.lua
      - name: Download fixed known-good FIX53 native Luanti COD4 28-gun APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p fix54-input fix54-build/overlay
          gh release download fix53-v26-native-chase-five-barricade-sizes \
            --repo "$GITHUB_REPOSITORY" \
            --pattern COD4-ZOMBIES-FIX53-CHASE-V26-SIZED-ARM64.apk \
            --dir fix54-input
          test -s fix54-input/COD4-ZOMBIES-FIX53-CHASE-V26-SIZED-ARM64.apk
      - name: Stage only original QuakeC damage bridge and Xziel Viril combatfx HUD
        run: |
          cp incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/v26_runtime.lua fix54-build/overlay/v26_runtime.lua
          cp incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/v26_viril_combatfx.lua fix54-build/overlay/v26_viril_combatfx.lua
          test "$(find fix54-build/overlay -type f | wc -l)" -eq 2
      - name: Repack FIX53 game, extend existing hit event with actual bullet damage/point only
        run: |
          set -euo pipefail
          python3 incoming/luanti-fix50b/build_playable_test.py \
            --fix49c fix54-input/COD4-ZOMBIES-FIX53-CHASE-V26-SIZED-ARM64.apk \
            --rebuilt fix54-input/COD4-ZOMBIES-FIX53-CHASE-V26-SIZED-ARM64.apk \
            --lua incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/init.lua \
            --overlay-dir fix54-build/overlay \
            --v26-original-hit-details \
            --output fix54-build/unsigned.apk
      - name: Strict gate original COD4 engine, all 28 guns, original v26 window meshes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io,zipfile,lzma,pathlib,json
          old=pathlib.Path('fix54-input/COD4-ZOMBIES-FIX53-CHASE-V26-SIZED-ARM64.apk')
          new=pathlib.Path('fix54-build/unsigned.apk')
          r=json.loads(pathlib.Path('fix54-build/packaging_report.json').read_text())
          assert r['assets']['baseline_asset_count']==9713,r
          assert r['assets']['candidate_asset_count']==9714,r
          root='games/voxelibre/mods/xz_zombies_classic/'
          combat='games/voxelibre/mods/ak47dev/combat.lua'
          expected={root+'init.lua':'replaced',root+'v26_runtime.lua':'replaced',
            root+'v26_viril_combatfx.lua':'added',combat:'replaced'}
          assert r['assets']['changed']==expected,r['assets']['changed']
          with zipfile.ZipFile(old) as base,zipfile.ZipFile(new) as current:
            for item in base.infolist():
              if item.filename=='assets/assets.zip' or item.filename.startswith('META-INF/'): continue
              a=current.getinfo(item.filename)
              assert (item.CRC,item.file_size)==(a.CRC,a.file_size),item.filename
            for p in ('lib/arm64-v8a/libluanti.so','AndroidManifest.xml','classes.dex','resources.arsc'):
              assert base.read(p)==current.read(p),'Native engine changed: '+p
            with zipfile.ZipFile(io.BytesIO(current.read('assets/assets.zip'))) as outer:
              assert outer.comment==b'XZ-ASSETS-1:9714'
              with zipfile.ZipFile(io.BytesIO(lzma.decompress(outer.read('luanti-assets.zip.xz')))) as assets:
                assert len(assets.namelist())==9714
                code=assets.read(combat).decode()
                assert code.count('target:punch(shooter,1,')==1
                assert code.count('api.on_cod4_impact(shooter,target,v26_before,v26_after,damage,intersection)')==1
                assert code.count('projectile_hit(hit.ref,shooter,damage,normal(b.velocity),hit.intersection_point)')==1
                script=assets.read(root+'init.lua')
                assert b'v26.cod4_projectile_impact(record,shooter,before,after,damage,critical)' in script
                assert b"loadfile(modpath .. '/v26_viril_combatfx.lua')" in script
                assert len(assets.read(root+'v26_viril_combatfx.lua'))>1000
                with zipfile.ZipFile(io.BytesIO(base.read('assets/assets.zip'))) as oldwrap:
                  with zipfile.ZipFile(io.BytesIO(lzma.decompress(oldwrap.read('luanti-assets.zip.xz')))) as oldgame:
                    for f in oldgame.infolist():
                      if f.filename in expected:continue
                      cur=assets.getinfo(f.filename)
                      assert (f.CRC,f.file_size)==(cur.CRC,cur.file_size),f.filename
          print('PASS: 9714 resources, EXACT original native COD4 28 guns and v26 models; per-hit extension only')
          PY
      - name: Sign and verify separate Android ARM64 FIX54 experiment
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/zipalign" -f -p 4 fix54-build/unsigned.apk fix54-build/aligned.apk
          keytool -genkeypair -keystore "$RUNNER_TEMP/fix54.jks" -alias fix54 \
            -storepass android -keypass android -keyalg RSA -keysize 3072 -validity 3650 -noprompt \
            -dname 'CN=FIX54 Original Viril v26 CombatFX Test,OU=Development,O=Xziel,C=US'
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/fix54.jks" --ks-key-alias fix54 \
            --ks-pass pass:android --key-pass pass:android --out \
            fix54-build/COD4-ZOMBIES-FIX54-ORIGINAL-VIRIL-HIT-FX-ARM64.apk fix54-build/aligned.apk
          "$TOOLS/apksigner" verify --verbose fix54-build/COD4-ZOMBIES-FIX54-ORIGINAL-VIRIL-HIT-FX-ARM64.apk
          "$TOOLS/aapt" dump badging fix54-build/COD4-ZOMBIES-FIX54-ORIGINAL-VIRIL-HIT-FX-ARM64.apk | tee fix54-build/badging.txt
          grep -q "package: name='com.xziel.zombies.fix50btest'" fix54-build/badging.txt
          unzip -t fix54-build/COD4-ZOMBIES-FIX54-ORIGINAL-VIRIL-HIT-FX-ARM64.apk >/dev/null
          sha256sum fix54-build/COD4-ZOMBIES-FIX54-ORIGINAL-VIRIL-HIT-FX-ARM64.apk | tee fix54-build/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FIX54-ORIGINAL-VIRIL-V26-INSTANT-HITS-AND-DAMAGE-FX-ARM64
          path: |
            fix54-build/COD4-ZOMBIES-FIX54-ORIGINAL-VIRIL-HIT-FX-ARM64.apk
            fix54-build/packaging_report.json
            fix54-build/badging.txt
            fix54-build/sha256.txt
          retention-days: 14
          if-no-files-found: error
      - name: Publish distinct experimental APK, never overwrite validated FIX53
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create fix54-v26-original-viril-impact-fx-arm64-playtest \
            fix54-build/COD4-ZOMBIES-FIX54-ORIGINAL-VIRIL-HIT-FX-ARM64.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'FIX54 experiment — original Xziel Viril white/gold damage HUD and immediate NZP per-hit points' \
            --notes 'Original working FIX53 engine, 28 COD4 weapons, ADS, USE, v26 five-size barricades and zombie chasing kept byte-identical. The old HP delta hook missed confirmed bullets due to VoxeLibre deferred processing. Exact original NZP DamageHandler nonfatal +10 score is now applied to every verified COD4 server-side raycast impact; kill rewards reconcile the prepaid hit. Xziel original Viril v26 C HUD algorithm (24 slots, 7 lanes, .62 s, white damage / golden headshot) is displayed via Luanti HUD adapter; not a native Quake renderer. Original QuakeC VM integration remains in a SEPARATE exploratory build and is NOT claimed complete by this APK. Actual Pixel Fold validation required; headspot uses native VoxeLibre head_eye_height mapping. New disposable key for com.xziel.zombies.fix50btest: BACK UP TEST WORLDS and uninstall only previous test package; keep FIX49C.'
