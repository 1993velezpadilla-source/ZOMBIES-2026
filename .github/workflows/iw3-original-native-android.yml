          for symbol in Hunk_UserCreate Hunk_UserAlloc Hunk_UserDestroy FS_CheckLocation FS_AddFileToList FS_ReturnPath FS_SanitizeFilename Sys_ListFiles MyAssertHandler; do
            grep -F "$symbol" "$RUNNER_TEMP/iw3-filtered-files-undefined.txt"
