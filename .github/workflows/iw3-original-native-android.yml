name: IW3 ORIGINAL SOURCE Android ARM64 math port (NOT APK)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/iw3-native-android-arm64-20261025
    paths:
      - .github/workflows/iw3-original-native-android.yml
      - android/iw3-native/**
      - tools/iw3_android/**
      - third_party/KisakCOD/src/**
      - tests/test_iw3_android_*.py
      - third_party/KisakCOD/src/universal/com_math_anglevectors.cpp

permissions:
  contents: read

concurrency:
  group: iw3-original-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-iw3-original-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NDK_VER: "27.2.12479018"
    steps:
      - uses: actions/checkout@v4

      - name: Verify original upstream IW3 source and synthesize header-only ABI overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_iw3_android_*.py' -v
          python3 tools/iw3_android/prepare_real_engine_math.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/com_math_anglevectors.cpp" \
            --surface-output "$RUNNER_TEMP/iw3-source/surfaceflags.cpp" \
            --constant-output "$RUNNER_TEMP/iw3-source/com_constantconfigstrings.cpp" \
            --report "$RUNNER_TEMP/iw3-native-source.json"
          python3 tools/iw3_android/prepare_g_runframe_prereqs.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/iw3_frame_memcpy.cpp" \
            --entity-loop-output "$RUNNER_TEMP/iw3-source/iw3_g_runframe_entity_loop.inc" \
            --report "$RUNNER_TEMP/iw3-original-g-runframe-audit.json"
          python3 tools/iw3_android/prepare_real_engine_pool.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/pool_allocator.cpp" \
            --report "$RUNNER_TEMP/iw3-original-pool-allocator.json"
          python3 tools/iw3_android/prepare_real_engine_hitloc.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/iw3_g_combat_hitloc.cpp" \
            --report "$RUNNER_TEMP/iw3-original-sp-hitloc.json"
          echo "IW3_ACTUAL_SOURCE_USED_FROM_KISAKCOD"

      - name: Compile and EXECUTE original KisakCOD aim math on host
        shell: bash
        run: |
          set -euo pipefail
          cmake -S android/iw3-native -B "$RUNNER_TEMP/iw3-build-host" \
            -DCMAKE_BUILD_TYPE=Release \
            -DIW3_EXTRACTED_MATH="$RUNNER_TEMP/iw3-source/com_math_anglevectors.cpp" \
            -DIW3_EXTRACTED_SURFACE="$RUNNER_TEMP/iw3-source/surfaceflags.cpp" \
            -DIW3_EXTRACTED_CONSTANTS="$RUNNER_TEMP/iw3-source/com_constantconfigstrings.cpp" \
            -DIW3_EXTRACTED_FRAME_MEMCPY="$RUNNER_TEMP/iw3-source/iw3_frame_memcpy.cpp" \
            -DIW3_EXTRACTED_POOL="$RUNNER_TEMP/iw3-source/pool_allocator.cpp" \
            -DIW3_EXTRACTED_HITLOC="$RUNNER_TEMP/iw3-source/iw3_g_combat_hitloc.cpp" \
            -DIW3_ENTITY_LOOP_INC="$RUNNER_TEMP/iw3-source/iw3_g_runframe_entity_loop.inc" \
            -DIW3_REAL_HEADER_ROOT="$GITHUB_WORKSPACE/third_party/KisakCOD/src/universal"
          cmake --build "$RUNNER_TEMP/iw3-build-host" -j 2
          ctest --test-dir "$RUNNER_TEMP/iw3-build-host" --output-on-failure
          echo "IW3_REAL_SOURCE_HOST_MATH_GREEN"

      - name: Check native engine modules for address and undefined behavior errors
        shell: bash
        run: |
          set -euo pipefail
          cmake -S android/iw3-native -B "$RUNNER_TEMP/iw3-build-host" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build "$RUNNER_TEMP/iw3-build-host" -j 2
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ctest --test-dir "$RUNNER_TEMP/iw3-build-host" --output-on-failure
          echo "IW3_REAL_SOURCE_HOST_ASAN_UBSAN_GREEN"

      - name: Install Android NDK for compiling original C++ engine function
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk/cmdline-tools/latest"
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/commandline-tools.zip" \
            'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
          unzip -qo "$RUNNER_TEMP/commandline-tools.zip" -d "$RUNNER_TEMP/commandline-temp"
          mv "$RUNNER_TEMP/commandline-temp/cmdline-tools/"* "$sdk/cmdline-tools/latest/"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" "ndk;${NDK_VER}"
          test -f "$sdk/ndk/${NDK_VER}/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=$sdk/ndk/${NDK_VER}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

      - name: Link original KisakCOD aim math into genuine Android arm64-v8a ELF
        shell: bash
        run: |
          set -euo pipefail
          cmake -S android/iw3-native -B "$RUNNER_TEMP/iw3-build-arm64" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DIW3_EXTRACTED_MATH="$RUNNER_TEMP/iw3-source/com_math_anglevectors.cpp" \
            -DIW3_EXTRACTED_SURFACE="$RUNNER_TEMP/iw3-source/surfaceflags.cpp" \
            -DIW3_EXTRACTED_CONSTANTS="$RUNNER_TEMP/iw3-source/com_constantconfigstrings.cpp" \
            -DIW3_EXTRACTED_FRAME_MEMCPY="$RUNNER_TEMP/iw3-source/iw3_frame_memcpy.cpp" \
            -DIW3_EXTRACTED_POOL="$RUNNER_TEMP/iw3-source/pool_allocator.cpp" \
            -DIW3_EXTRACTED_HITLOC="$RUNNER_TEMP/iw3-source/iw3_g_combat_hitloc.cpp" \
            -DIW3_ENTITY_LOOP_INC="$RUNNER_TEMP/iw3-source/iw3_g_runframe_entity_loop.inc" \
            -DIW3_REAL_HEADER_ROOT="$GITHUB_WORKSPACE/third_party/KisakCOD/src/universal"
          cmake --build "$RUNNER_TEMP/iw3-build-arm64" -j 2
          so="$RUNNER_TEMP/iw3-build-arm64/libiw3_sp_math.so"
          test -s "$so"
          elf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$elf" -h "$so" | tee "$RUNNER_TEMP/iw3-arm64-elf.txt"
          grep -F 'Class:                             ELF64' "$RUNNER_TEMP/iw3-arm64-elf.txt"
          grep -F 'Machine:                           AArch64' "$RUNNER_TEMP/iw3-arm64-elf.txt"
          "$elf" --dyn-syms "$so" > "$RUNNER_TEMP/iw3-arm64-symbols.txt"
          grep 'z2026_iw3_angle_vectors' "$RUNNER_TEMP/iw3-arm64-symbols.txt"
          grep 'z2026_iw3_math_smoke' "$RUNNER_TEMP/iw3-arm64-symbols.txt"
          grep 'z2026_iw3_snap_float_to_int' "$RUNNER_TEMP/iw3-arm64-symbols.txt"
          grep 'z2026_iw3_snap_float_smoke' "$RUNNER_TEMP/iw3-arm64-symbols.txt"
          grep 'z2026_iw3_surface_type_from_name' "$RUNNER_TEMP/iw3-arm64-symbols.txt"
          grep 'z2026_iw3_surface_smoke' "$RUNNER_TEMP/iw3-arm64-symbols.txt"
          grep 'z2026_iw3_configstrings_smoke' "$RUNNER_TEMP/iw3-arm64-symbols.txt"
          grep 'z2026_iw3_configstring_num' "$RUNNER_TEMP/iw3-arm64-symbols.txt"
          grep 'z2026_iw3_frame_memcpy_smoke' "$RUNNER_TEMP/iw3-arm64-symbols.txt"
          grep 'z2026_iw3_real_pool_smoke' "$RUNNER_TEMP/iw3-arm64-symbols.txt"
          grep 'z2026_iw3_hitloc_copy_smoke' "$RUNNER_TEMP/iw3-arm64-symbols.txt"
          grep 'z2026_platform_monotonic_ns' "$RUNNER_TEMP/iw3-arm64-symbols.txt"
          grep 'z2026_platform_set_data_root' "$RUNNER_TEMP/iw3-arm64-symbols.txt"
          grep 'z2026_platform_read_file' "$RUNNER_TEMP/iw3-arm64-symbols.txt"
          grep 'z2026_platform_touch_event' "$RUNNER_TEMP/iw3-arm64-symbols.txt"
          grep 'z2026_platform_touch_snapshot' "$RUNNER_TEMP/iw3-arm64-symbols.txt"
          # No Android package or game claims: this is a single authentic
          # engine source C++ module ported and linked into a native .so.
          echo "IW3_ORIGINAL_SOURCE_ANDROID_ARM64_ELF_GREEN"

      - name: Cross-compile ACTUAL G_RunFrame typed entity code with Android ARM64 ABI
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          "$ndk/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -Wall -Wextra -UNDEBUG -O2 \
            -I"$RUNNER_TEMP/iw3-source" \
            -c android/iw3-native/frame_loop_abi_test.cpp \
            -o "$RUNNER_TEMP/iw3-authentic-sp-frame-entity-arm64.o"
          "$ndk/bin/llvm-readelf" -h "$RUNNER_TEMP/iw3-authentic-sp-frame-entity-arm64.o" \
            | tee "$RUNNER_TEMP/iw3-sp-frame-abi64-object-elf.txt"
          grep -F 'Machine:                           AArch64' "$RUNNER_TEMP/iw3-sp-frame-abi64-object-elf.txt"
          grep -F 'Class:                             ELF64' "$RUNNER_TEMP/iw3-sp-frame-abi64-object-elf.txt"
          echo 'IW3_VERBATIM_G_RUNFRAME_ENTITY_LOOP_ANDROID_ARM64_COMPILES_GREEN'
          # Caution: This proves only the corrected source block compiling
          # for ARM64, NOT that full G_RunFrame or game engine links/runs.

      - name: Attach evidence and compiled native module (NOT an APK)
        uses: actions/upload-artifact@v4
        with:
          name: z2026-iw3-real-math-arm64-phase-a-NOT-APK
          path: |
            ${{ runner.temp }}/iw3-build-arm64/libiw3_sp_math.so
            ${{ runner.temp }}/iw3-native-source.json
            ${{ runner.temp }}/iw3-original-g-runframe-audit.json
            ${{ runner.temp }}/iw3-original-pool-allocator.json
            ${{ runner.temp }}/iw3-original-sp-hitloc.json
            ${{ runner.temp }}/iw3-authentic-sp-frame-entity-arm64.o
            ${{ runner.temp }}/iw3-sp-frame-abi64-object-elf.txt
            ${{ runner.temp }}/iw3-arm64-elf.txt
            ${{ runner.temp }}/iw3-arm64-symbols.txt
          retention-days: 30
          if-no-files-found: error
