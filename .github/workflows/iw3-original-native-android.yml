          "$ndk/bin/aarch64-linux-android26-clang++" "${common_flags[@]}" -c "$trigger_source" -o "$trigger_object"
          "$ndk/bin/aarch64-linux-android26-clang++" "${common_flags[@]}" -c "$sentient_source" -o "$sentient_object"
          "$ndk/bin/aarch64-linux-android26-clang++" "${common_flags[@]}" -c "$entity_source" -o "$entity_object"

