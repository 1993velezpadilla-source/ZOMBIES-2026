name: IW3 ORIGINAL SOURCE Android ARM64 math port (NOT APK)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/iw3-original-native-android.yml'
      - 'android/iw3-native/**'
      - 'tools/iw3_android/**'
      - 'tests/test_iw3_android_*.py'
      - 'third_party/KisakCOD/src/**'
  push:
    branches:
      - feature/iw3-native-android-arm64-20261025
    paths:
      - .github/workflows/iw3-original-native-android.yml
      - android/iw3-native/**
      - tools/iw3_android/**
      - third_party/KisakCOD/src/**
      - tests/test_iw3_android_*.py
      - third_party/KisakCOD/src/universal/com_math_anglevectors.cpp

permissions:
  contents: read

concurrency:
  group: iw3-original-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-iw3-original-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NDK_VER: "27.2.12479018"
    steps:
      - uses: actions/checkout@v4

      - name: Verify original upstream IW3 source and synthesize header-only ABI overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_iw3_android_*.py' -v
          python3 tools/iw3_android/prepare_real_engine_math.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/com_math_anglevectors.cpp" \
            --surface-output "$RUNNER_TEMP/iw3-source/surfaceflags.cpp" \
            --constant-output "$RUNNER_TEMP/iw3-source/com_constantconfigstrings.cpp" \
            --report "$RUNNER_TEMP/iw3-native-source.json"
          python3 tools/iw3_android/prepare_g_runframe_prereqs.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/iw3_frame_memcpy.cpp" \
            --entity-loop-output "$RUNNER_TEMP/iw3-source/iw3_g_runframe_entity_loop.inc" \
            --report "$RUNNER_TEMP/iw3-original-g-runframe-audit.json"
          python3 tools/iw3_android/prepare_real_engine_pool.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/pool_allocator.cpp" \
            --report "$RUNNER_TEMP/iw3-original-pool-allocator.json"
          python3 tools/iw3_android/prepare_real_engine_hitloc.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/iw3_g_combat_hitloc.cpp" \
            --report "$RUNNER_TEMP/iw3-original-sp-hitloc.json"
          python3 tools/iw3_android/prepare_real_engine_iwd_names.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/iw3_iwd_names.cpp" \
            --report "$RUNNER_TEMP/iw3-original-iwd-names.json"
          python3 tools/iw3_android/prepare_real_engine_unzip.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/unzip.cpp" \
            --report "$RUNNER_TEMP/iw3-original-unzip-abi.json"
          python3 tools/iw3_android/prepare_real_engine_iwd_mount.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/fs_load_zip.cpp" \
            --report "$RUNNER_TEMP/iw3-original-iwd-mount.json"
          python3 tools/iw3_android/prepare_real_engine_iwd_services.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/iw3_iwd_services.cpp" \
            --report "$RUNNER_TEMP/iw3-original-iwd-services.json"
          python3 tools/iw3_android/prepare_real_engine_iwd_searchpath.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/iw3_iwd_searchpath.cpp" \
            --report "$RUNNER_TEMP/iw3-original-iwd-searchpath.json"
          python3 tools/iw3_android/prepare_real_engine_iwd_directory.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/iw3_iwd_directory.cpp" \
            --report "$RUNNER_TEMP/iw3-original-iwd-directory.json"
          python3 tools/iw3_android/prepare_real_engine_iwd_lookup.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/iw3_iwd_lookup.cpp" \
            --report "$RUNNER_TEMP/iw3-original-iwd-lookup.json"
          python3 tools/iw3_android/prepare_real_engine_iwd_read.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/iw3_iwd_read_lifecycle.cpp" \
            --report "$RUNNER_TEMP/iw3-original-iwd-read-lifecycle.json"
          python3 tools/iw3_android/prepare_real_engine_fs_read.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/iw3_fs_read.cpp" \
            --report "$RUNNER_TEMP/iw3-original-fs-read.json"
          python3 tools/iw3_android/prepare_real_engine_fs_startup.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/iw3_fs_startup.cpp" \
            --report "$RUNNER_TEMP/iw3-original-fs-startup.json"
          python3 tools/iw3_android/prepare_real_engine_filtered_files.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/iw3_filtered_files_location.cpp" \
            --report "$RUNNER_TEMP/iw3-original-filtered-files-location.json"
          python3 tools/iw3_android/prepare_real_engine_dvar_pointer_abi.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/iw3_dvar_pointer_abi.cpp" \
            --smoke-output "$RUNNER_TEMP/iw3-source/iw3_dvar_pointer_smoke.cpp" \
            --report "$RUNNER_TEMP/iw3-original-dvar-pointer-abi.json"
          python3 tools/iw3_android/prepare_real_engine_dvar_vec4.py \
            --engine third_party/KisakCOD \
            --output "$RUNNER_TEMP/iw3-source/iw3_dvar_vec4_compare.cpp" \
            --report "$RUNNER_TEMP/iw3-original-dvar-vec4.json"
          echo "IW3_ORIGINAL_FILE_READ_LIFECYCLE_STAGED_NOT_LINKED"
          echo "IW3_ORIGINAL_FS_READ_ABI_AUDIT_SOURCE_STAGED"
          echo "IW3_ACTUAL_SOURCE_USED_FROM_KISAKCOD"

      - name: Compile and EXECUTE original KisakCOD aim math on host
        shell: bash
        run: |
          set -euo pipefail
          cmake -S android/iw3-native -B "$RUNNER_TEMP/iw3-build-host" \
            -DCMAKE_BUILD_TYPE=Release \
            -DIW3_EXTRACTED_MATH="$RUNNER_TEMP/iw3-source/com_math_anglevectors.cpp" \
            -DIW3_EXTRACTED_SURFACE="$RUNNER_TEMP/iw3-source/surfaceflags.cpp" \
            -DIW3_EXTRACTED_CONSTANTS="$RUNNER_TEMP/iw3-source/com_constantconfigstrings.cpp" \
            -DIW3_EXTRACTED_FRAME_MEMCPY="$RUNNER_TEMP/iw3-source/iw3_frame_memcpy.cpp" \
            -DIW3_EXTRACTED_POOL="$RUNNER_TEMP/iw3-source/pool_allocator.cpp" \
            -DIW3_EXTRACTED_HITLOC="$RUNNER_TEMP/iw3-source/iw3_g_combat_hitloc.cpp" \
            -DIW3_EXTRACTED_IWD_NAMES="$RUNNER_TEMP/iw3-source/iw3_iwd_names.cpp" \
            -DIW3_EXTRACTED_UNZIP="$RUNNER_TEMP/iw3-source/unzip.cpp" \
            -DIW3_EXTRACTED_IWD_MOUNT="$RUNNER_TEMP/iw3-source/fs_load_zip.cpp" \
            -DIW3_EXTRACTED_IWD_SERVICES="$RUNNER_TEMP/iw3-source/iw3_iwd_services.cpp" \
            -DIW3_EXTRACTED_IWD_SEARCHPATH="$RUNNER_TEMP/iw3-source/iw3_iwd_searchpath.cpp" \
            -DIW3_EXTRACTED_IWD_DIRECTORY="$RUNNER_TEMP/iw3-source/iw3_iwd_directory.cpp" \
            -DIW3_EXTRACTED_IWD_LOOKUP="$RUNNER_TEMP/iw3-source/iw3_iwd_lookup.cpp" \
            -DIW3_EXTRACTED_FS_READ="$RUNNER_TEMP/iw3-source/iw3_fs_read.cpp" \
            -DIW3_EXTRACTED_FS_STARTUP="$RUNNER_TEMP/iw3-source/iw3_fs_startup.cpp" \
            -DIW3_EXTRACTED_DVAR_POINTER_ABI="$RUNNER_TEMP/iw3-source/iw3_dvar_pointer_abi.cpp" \
            -DIW3_EXTRACTED_DVAR_VEC4_COMPARE="$RUNNER_TEMP/iw3-source/iw3_dvar_vec4_compare.cpp" \
            -DIW3_EXTRACTED_DVAR_POINTER_SMOKE="$RUNNER_TEMP/iw3-source/iw3_dvar_pointer_smoke.cpp" \
            -DIW3_EXTRACTED_FILTERED_FILES="$RUNNER_TEMP/iw3-source/iw3_filtered_files_location.cpp" \
            -DIW3_ENTITY_LOOP_INC="$RUNNER_TEMP/iw3-source/iw3_g_runframe_entity_loop.inc" \
            -DIW3_REAL_HEADER_ROOT="$GITHUB_WORKSPACE/third_party/KisakCOD/src/universal"
          cmake --build "$RUNNER_TEMP/iw3-build-host" -j 2
          ctest --test-dir "$RUNNER_TEMP/iw3-build-host" --output-on-failure
          echo "IW3_REAL_SOURCE_HOST_MATH_GREEN"

      - name: Check native engine modules for address and undefined behavior errors
        shell: bash
        run: |
          set -euo pipefail
          cmake -S android/iw3-native -B "$RUNNER_TEMP/iw3-build-host" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build "$RUNNER_TEMP/iw3-build-host" -j 2
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ctest --test-dir "$RUNNER_TEMP/iw3-build-host" --output-on-failure
          echo "IW3_REAL_SOURCE_HOST_ASAN_UBSAN_GREEN"

      - name: Install Android NDK for compiling original C++ engine function
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk/cmdline-tools/latest"
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/commandline-tools.zip" \
            'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
          unzip -qo "$RUNNER_TEMP/commandline-tools.zip" -d "$RUNNER_TEMP/commandline-temp"
          mv "$RUNNER_TEMP/commandline-temp/cmdline-tools/"* "$sdk/cmdline-tools/latest/"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" "ndk;${NDK_VER}"
          test -f "$sdk/ndk/${NDK_VER}/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=$sdk/ndk/${NDK_VER}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

      - name: Link original KisakCOD aim math into genuine Android arm64-v8a ELF
        shell: bash
        run: |
          set -euo pipefail
          cmake -S android/iw3-native -B "$RUNNER_TEMP/iw3-build-arm64" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DIW3_EXTRACTED_MATH="$RUNNER_TEMP/iw3-source/com_math_anglevectors.cpp" \
            -DIW3_EXTRACTED_SURFACE="$RUNNER_TEMP/iw3-source/surfaceflags.cpp" \
            -DIW3_EXTRACTED_CONSTANTS="$RUNNER_TEMP/iw3-source/com_constantconfigstrings.cpp" \
            -DIW3_EXTRACTED_FRAME_MEMCPY="$RUNNER_TEMP/iw3-source/iw3_frame_memcpy.cpp" \
            -DIW3_EXTRACTED_POOL="$RUNNER_TEMP/iw3-source/pool_allocator.cpp" \
            -DIW3_EXTRACTED_HITLOC="$RUNNER_TEMP/iw3-source/iw3_g_combat_hitloc.cpp" \
            -DIW3_EXTRACTED_IWD_NAMES="$RUNNER_TEMP/iw3-source/iw3_iwd_names.cpp" \
            -DIW3_EXTRACTED_UNZIP="$RUNNER_TEMP/iw3-source/unzip.cpp" \
            -DIW3_EXTRACTED_IWD_MOUNT="$RUNNER_TEMP/iw3-source/fs_load_zip.cpp" \
            -DIW3_EXTRACTED_IWD_SERVICES="$RUNNER_TEMP/iw3-source/iw3_iwd_services.cpp" \
            -DIW3_EXTRACTED_IWD_SEARCHPATH="$RUNNER_TEMP/iw3-source/iw3_iwd_searchpath.cpp" \
            -DIW3_EXTRACTED_IWD_DIRECTORY="$RUNNER_TEMP/iw3-source/iw3_iwd_directory.cpp" \
            -DIW3_EXTRACTED_IWD_LOOKUP="$RUNNER_TEMP/iw3-source/iw3_iwd_lookup.cpp" \
            -DIW3_EXTRACTED_FS_READ="$RUNNER_TEMP/iw3-source/iw3_fs_read.cpp" \
            -DIW3_EXTRACTED_FS_STARTUP="$RUNNER_TEMP/iw3-source/iw3_fs_startup.cpp" \
            -DIW3_EXTRACTED_DVAR_POINTER_ABI="$RUNNER_TEMP/iw3-source/iw3_dvar_pointer_abi.cpp" \
            -DIW3_EXTRACTED_DVAR_VEC4_COMPARE="$RUNNER_TEMP/iw3-source/iw3_dvar_vec4_compare.cpp" \
            -DIW3_EXTRACTED_DVAR_POINTER_SMOKE="$RUNNER_TEMP/iw3-source/iw3_dvar_pointer_smoke.cpp" \
            -DIW3_EXTRACTED_FILTERED_FILES="$RUNNER_TEMP/iw3-source/iw3_filtered_files_location.cpp" \
            -DIW3_ENTITY_LOOP_INC="$RUNNER_TEMP/iw3-source/iw3_g_runframe_entity_loop.inc" \
            -DIW3_REAL_HEADER_ROOT="$GITHUB_WORKSPACE/third_party/KisakCOD/src/universal"
          cmake --build "$RUNNER_TEMP/iw3-build-arm64" -j 2

          fs_read_archive="$RUNNER_TEMP/iw3-build-arm64/libiw3_sp_fs_read.a"
          test -s "$fs_read_archive"
          llvm_nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$llvm_nm" -C --defined-only "$fs_read_archive" | tee "$RUNNER_TEMP/iw3-original-fs-read-defined.txt"
          grep -F 'FS_FileForHandle' "$RUNNER_TEMP/iw3-original-fs-read-defined.txt"
          grep -F 'FS_Read' "$RUNNER_TEMP/iw3-original-fs-read-defined.txt"
          "$llvm_nm" -u -C "$fs_read_archive" | tee "$RUNNER_TEMP/iw3-original-fs-read-undefined.txt"
          # fsh is now defined by the shared original-engine source and is
          # referenced by the original FS_FOpenFileReadForThread -> FS_Read -> FS_FCloseFile
          # lifecycle. The JNI diagnostic uses this same table and exercises IWD clone
          # plus rooted directory fallback paths; full com_files.cpp is not linked here.
          "$llvm_nm" -C "$fs_read_archive" | tee "$RUNNER_TEMP/iw3-original-fs-read-symbols.txt"
          grep -E ' [BbDd] fsh' "$RUNNER_TEMP/iw3-original-fs-read-symbols.txt"
          grep -E ' U fsh' "$RUNNER_TEMP/iw3-original-fs-read-symbols.txt"
          echo "IW3_ENGINE_SHARED_FSH_TABLE_AARCH64_AUDIT_GREEN"

          # Do not let the filtered-files source silently become an optional,
          # unverified compile. Audit its actual AArch64 archive and preserve
          # unresolved engine services as evidence that this is not falsely
          # reported as a linked filesystem runtime.
          filtered_archive="$RUNNER_TEMP/iw3-build-arm64/libiw3_sp_filtered_files.a"
          test -s "$filtered_archive"
          "$llvm_nm" -C --defined-only "$filtered_archive" | tee "$RUNNER_TEMP/iw3-filtered-files-defined.txt"
          grep -F 'FS_ListFilteredFilesInLocation' "$RUNNER_TEMP/iw3-filtered-files-defined.txt"
          grep -F 'FS_ListFilteredFiles(' "$RUNNER_TEMP/iw3-filtered-files-defined.txt"
          "$llvm_nm" -u -C "$filtered_archive" | tee "$RUNNER_TEMP/iw3-filtered-files-undefined.txt"
          for symbol in Hunk_UserCreate Hunk_UserAlloc Hunk_UserDestroy FS_CheckLocation FS_AddFileToList FS_ReturnPath FS_SanitizeFilename Sys_ListFiles MyAssertHandler; do
            grep -F "$symbol" "$RUNNER_TEMP/iw3-filtered-files-undefined.txt"
          done
          echo "IW3_ORIGINAL_FILTERED_FILES_AARCH64_SYMBOL_AND_SERVICE_AUDIT_GREEN"
          echo "IW3_ORIGINAL_FILTERED_FILE_LIST_NATIVE_POINTER_ARRAY_AARCH64_COMPILE_GREEN"

          # Compile original search-path insertion and game-directory setup too.
          # The only directory-presence service is a fail-closed wrapper around
          # the retained Android app-private root. Remaining dvar/IWD/file/language
          # dependencies stay visible; this is still not a linked filesystem runtime.
          startup_archive="$RUNNER_TEMP/iw3-build-arm64/libiw3_sp_fs_startup.a"
          test -s "$startup_archive"
          "$llvm_nm" -C --defined-only "$startup_archive" | tee "$RUNNER_TEMP/iw3-fs-startup-defined.txt"
          for symbol in FS_AddSearchPath FS_AddGameDirectory FS_AddLocalizedGameDirectory FS_ReplaceSeparators FS_BuildOSPath FS_BuildOSPathForThread FS_RegisterDvars FS_Startup FS_SetRestrictions FS_IsBasePathValid FS_InitFilesystem Sys_Cwd Sys_DefaultCDPath Sys_DirectoryHasContents; do
            grep -F "$symbol" "$RUNNER_TEMP/iw3-fs-startup-defined.txt"
          done
          for symbol in 'FS_ReplaceSeparators(' 'FS_BuildOSPath(' 'FS_BuildOSPathForThread('; do
            grep -F "$symbol" "$RUNNER_TEMP/iw3-fs-startup-defined.txt"
          done
          # Archive-member U entries are reported even when another member of
          # the same archive defines the symbol. Perform a relocatable link of
          # every member before deciding whether the Android provider resolved it.
          "$llvm_nm" -u -C "$startup_archive" | tee "$RUNNER_TEMP/iw3-fs-startup-member-undefined.txt"
          ld_lld="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld"
          test -x "$ld_lld"
          "$ld_lld" -m aarch64linux -r --whole-archive "$startup_archive" --no-whole-archive \
            -o "$RUNNER_TEMP/iw3-fs-startup-combined.o"
          "$llvm_nm" -u -C "$RUNNER_TEMP/iw3-fs-startup-combined.o" | tee "$RUNNER_TEMP/iw3-fs-startup-undefined.txt"
          for symbol in Dvar_RegisterInt Dvar_RegisterString Dvar_RegisterBool FS_AddIwdFilesForGameDirectory Z_Malloc SEH_GetLanguageName FS_ReadFile SEH_InitLanguage; do
            grep -F "$symbol" "$RUNNER_TEMP/iw3-fs-startup-undefined.txt"
          done
          for symbol in 'FS_ReplaceSeparators(' 'FS_BuildOSPath(' 'FS_BuildOSPathForThread('; do
            if grep -F "$symbol" "$RUNNER_TEMP/iw3-fs-startup-undefined.txt"; then
              echo "Original $symbol dependency must be resolved by the extracted path-builder source" >&2
              exit 1
            fi
          done
          echo "IW3_ORIGINAL_FS_BUILD_OS_PATH_AARCH64_RESOLVED"
          if grep -F "Sys_DirectoryHasContents" "$RUNNER_TEMP/iw3-fs-startup-undefined.txt"; then
            echo "Android rooted Sys_DirectoryHasContents adapter failed to resolve FS startup" >&2
            exit 1
          fi
          echo "IW3_ORIGINAL_FS_STARTUP_AARCH64_RELOCATABLE_LINK_AUDIT_GREEN"

          # Verify the corrected original dvar pointer/string/enum functions
          # compile into an AArch64 archive. Its unresolved registry services
          # are intentionally visible: this is not a linked dvar runtime.
          dvar_archive="$RUNNER_TEMP/iw3-build-arm64/libiw3_sp_dvar_pointer_abi.a"
          test -s "$dvar_archive"
          "$llvm_nm" -C --defined-only "$dvar_archive" | tee "$RUNNER_TEMP/iw3-dvar-pointer-defined.txt"
          for symbol in Dvar_RegisterVariant Dvar_RegisterString Dvar_RegisterEnum Dvar_StringToEnum Dvar_UpdateEnumDomain Dvar_SetVariant Dvar_SetDomainFunc Dvar_SetStringFromSource Dvar_ClampValueToDomain Dvar_ClampVectorToDomain; do
            grep -F "$symbol" "$RUNNER_TEMP/iw3-dvar-pointer-defined.txt"
          done
          "$llvm_nm" -u -C "$dvar_archive" | tee "$RUNNER_TEMP/iw3-dvar-pointer-undefined.txt"
          for symbol in Dvar_FindMalleableVar Dvar_RegisterNew Dvar_Reregister; do
            grep -F "$symbol" "$RUNNER_TEMP/iw3-dvar-pointer-undefined.txt"
          done
          if grep -F "Dvar_RegisterVariant" "$RUNNER_TEMP/iw3-dvar-pointer-undefined.txt"; then
            echo "Dvar_RegisterVariant must be defined by the extracted original source" >&2
            exit 1
          fi
          echo "IW3_ORIGINAL_DVAR_REGISTER_VARIANT_AARCH64_DEFINED_WITH_REAL_DEPENDENCIES_VISIBLE"
          echo "IW3_ORIGINAL_DVAR_LP64_POINTER_ABI_AARCH64_COMPILE_GREEN"

          # Audit the full original dvar.cpp together with its real POSIX
          # NET_Sleep provider. A relocatable link must resolve NET_Sleep while
          # leaving unrelated engine services unresolved and visible.
          dvar_full_archive="$RUNNER_TEMP/iw3-build-arm64/libiw3_sp_dvar_android.a"
          test -s "$dvar_full_archive"
          "$llvm_nm" -C --defined-only "$dvar_full_archive" | tee "$RUNNER_TEMP/iw3-full-dvar-defined.txt"
          grep -F 'NET_Sleep(int)' "$RUNNER_TEMP/iw3-full-dvar-defined.txt"
          grep -F 'Dvar_RegisterString' "$RUNNER_TEMP/iw3-full-dvar-defined.txt"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld" \
            -m aarch64linux -r --whole-archive "$dvar_full_archive" \
            --no-whole-archive -o "$RUNNER_TEMP/iw3-full-dvar-combined.o"
          "$llvm_nm" -u -C "$RUNNER_TEMP/iw3-full-dvar-combined.o" | tee "$RUNNER_TEMP/iw3-full-dvar-unresolved.txt"
          if grep -F 'NET_Sleep(int)' "$RUNNER_TEMP/iw3-full-dvar-unresolved.txt"; then
            echo "Android NET_Sleep provider failed to resolve the original dvar dependency" >&2
            exit 1
          fi
          if grep -F 'Vec4Compare' "$RUNNER_TEMP/iw3-full-dvar-unresolved.txt"; then
            echo "Original Vec4Compare dependency should have been resolved from the extracted KisakCOD body" >&2
            exit 1
          fi
          # Other engine services must remain visible: this is not a full runtime link.
          grep -F 'Com_Printf(int, char const*, ...)' "$RUNNER_TEMP/iw3-full-dvar-defined.txt"
          if grep -F 'Com_Printf' "$RUNNER_TEMP/iw3-full-dvar-unresolved.txt"; then
            echo "Android Com_Printf log provider failed to resolve the dvar output dependency" >&2
            exit 1
          fi
          # Android's system log API is intentionally the remaining platform import.
          grep -F '__android_log_write' "$RUNNER_TEMP/iw3-full-dvar-unresolved.txt"
          echo "IW3_ORIGINAL_DVAR_NET_SLEEP_VEC4_AND_ANDROID_LOG_PROVIDER_RESOLVED_ENGINE_SERVICES_VISIBLE"

          # Integrate the authentic startup object with the complete original
          # dvar translation unit and its Android providers. This must resolve
          # the startup's real Dvar_Register* edges without hiding the next
          # filesystem/language dependencies or claiming a runtime invocation.
          startup_dvar_combined="$RUNNER_TEMP/iw3-fs-dvar-startup-combined.o"
          "$ld_lld" -m aarch64linux -r --whole-archive \
            "$startup_archive" "$dvar_full_archive" --no-whole-archive \
            -o "$startup_dvar_combined"
          "$llvm_nm" -C --defined-only "$startup_dvar_combined" \
            | tee "$RUNNER_TEMP/iw3-fs-dvar-startup-defined.txt"
          "$llvm_nm" -u -C "$startup_dvar_combined" \
            | tee "$RUNNER_TEMP/iw3-fs-dvar-startup-undefined.txt"
          for symbol in Dvar_RegisterInt Dvar_RegisterString Dvar_RegisterBool; do
            grep -F "$symbol" "$RUNNER_TEMP/iw3-fs-dvar-startup-defined.txt"
            if grep -F "$symbol" "$RUNNER_TEMP/iw3-fs-dvar-startup-undefined.txt"; then
              echo "Original FS startup Dvar registration still unresolved: $symbol" >&2
              exit 1
            fi
          done
          # These are now the explicit next integration edges; do not paper over
          # them with stubs or claim FS_Startup/FS_InitFilesystem has executed.
          for symbol in FS_AddIwdFilesForGameDirectory Z_Malloc SEH_GetLanguageName FS_ReadFile SEH_InitLanguage; do
            grep -F "$symbol" "$RUNNER_TEMP/iw3-fs-dvar-startup-undefined.txt"
          done
          echo "IW3_ORIGINAL_FS_STARTUP_DVAR_REGISTRATION_AARCH64_COMBINED_LINK_GREEN"
