          grep 'z2026_iw3_surface_type_from_name' "$RUNNER_TEMP/iw3-arm64-symbols.txt"
          grep 'z2026_iw3_surface_smoke' "$RUNNER_TEMP/iw3-arm64-symbols.txt"
          grep 'z2026_iw3_configstrings_smoke' "$RUNNER_TEMP/iw3-arm64-symbols.txt"
