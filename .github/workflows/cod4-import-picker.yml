name: Android COD4 in-app import folder picker test
on:
  push:
    paths:
      - '.github/workflows/cod4-import-picker.yml'
      - 'tools/test_android_folder_picker.py'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  importer-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download unchanged COD4 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p _release_assets/cod4
          gh release download mediafire-COD4-apk --repo "$GITHUB_REPOSITORY" --pattern COD4.apk --dir _release_assets/cod4
          echo '40386503d564b0985423339b5ccd5611dc60ce08ebe1b4ae494d4de22a62473c  _release_assets/cod4/COD4.apk' | sha256sum --check
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probe app folder-import UI with synthetic directory
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 3072M
          disk-size: 8192M
          force-avd-creation: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb install -r _release_assets/cod4/COD4.apk
            python3 tools/test_android_folder_picker.py
      - name: Preserve screenshots and observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cod4-import-picker-synthetic-ui
          path: smoke-out/import-picker/
          retention-days: 14
          if-no-files-found: warn
