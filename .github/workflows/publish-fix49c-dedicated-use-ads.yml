name: Publish FIX49C dedicated USE + ADS Android test APK
on:
  push:
    paths:
      - '.github/workflows/publish-fix49c-dedicated-use-ads.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-fix49c-dedicated-use-ads
  cancel-in-progress: false

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Fetch 10 signed APK transfer parts
        shell: bash
        env:
          LINK_00: 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-819c-822f-b258-7bad090098f7/raw?se=2026-11-11T21%3A43%3A18Z&sp=r&sv=2026-06-06&sr=b&scid=b533719d-2a51-5dfd-ae77-91454ff30d49&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T09%3A19%3A24Z&ske=2026-11-12T09%3A19%3A24Z&sks=b&skv=2026-06-06&sig=XR7r9bpArJ/bM3%2Bhc73tFfKr4RxXVE1sKzbVXW6hE6I%3D'
          LINK_01: 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-709c-822f-8e0d-a3ed2fb73259/raw?se=2026-11-11T21%3A43%3A05Z&sp=r&sv=2026-06-06&sr=b&scid=f683993e-36e2-5ae5-8caa-43f107bc20d5&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T11%3A00%3A39Z&ske=2026-11-12T11%3A00%3A39Z&sks=b&skv=2026-06-06&sig=ck3UNqUMsjmOXCuJ8nciaIARZvbd5ldPYJN%2B9Svjmiw%3D'
          LINK_02: 'https://sdmntpreastus3.oaiusercontent.com/files/00000000-ca0c-8212-b890-f0bab1234727/raw?se=2026-11-11T21%3A43%3A04Z&sp=r&sv=2026-06-06&sr=b&scid=c50af010-8b7d-5df4-ad01-464db621584d&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T00%3A55%3A30Z&ske=2026-11-12T00%3A55%3A30Z&sks=b&skv=2026-06-06&sig=z4mSffRvwzYTJ6OwQI/fg2qnZcrdzuGCo8CcZGOtSJ0%3D'
          LINK_03: 'https://sdmntpreastus.oaiusercontent.com/files/00000000-f278-81f9-93bd-a9d388d6ac23/raw?se=2026-11-11T21%3A43%3A03Z&sp=r&sv=2026-06-06&sr=b&scid=eda8e901-c2c5-59a0-96af-59edb97b0bd3&skoid=e96cf01c-9c0f-4e27-b41e-0f2e435e6532&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T02%3A15%3A08Z&ske=2026-11-12T02%3A15%3A08Z&sks=b&skv=2026-06-06&sig=sJuTiTW8XiS4mYYfZEWg%2BiMy%2BczYb55DY6y2qRPM02E%3D'
          LINK_04: 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-2f08-822f-b135-34a915d685ab/raw?se=2026-11-11T21%3A43%3A05Z&sp=r&sv=2026-06-06&sr=b&scid=f8eebde8-88a2-53a6-bd41-19825670cf37&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T14%3A06%3A27Z&ske=2026-11-12T14%3A06%3A27Z&sks=b&skv=2026-06-06&sig=oa0RJYrT1B4t6GG%2BQesxp%2BKpxulI1a5DC8UO8WmPKZM%3D'
          LINK_05: 'https://sdmntpreastus.oaiusercontent.com/files/00000000-3f50-81f9-97af-de845fb86d3f/raw?se=2026-11-11T21%3A43%3A08Z&sp=r&sv=2026-06-06&sr=b&scid=a6a72025-6e95-57a6-91f8-dd5f78ac03e7&skoid=e96cf01c-9c0f-4e27-b41e-0f2e435e6532&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T01%3A23%3A39Z&ske=2026-11-12T01%3A23%3A39Z&sks=b&skv=2026-06-06&sig=SMFKAZkUof0KYicmL7jCFT0WJG4qgxaBIN82Ow2gvlw%3D'
          LINK_06: 'https://sdmntpreastus.oaiusercontent.com/files/00000000-88a0-81f9-a785-ee22349c46a2/raw?se=2026-11-11T21%3A43%3A09Z&sp=r&sv=2026-06-06&sr=b&scid=648fab4e-0f11-52b4-812c-6322100b05a2&skoid=e96cf01c-9c0f-4e27-b41e-0f2e435e6532&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T01%3A18%3A57Z&ske=2026-11-12T01%3A18%3A57Z&sks=b&skv=2026-06-06&sig=sK9ZMZ4B%2BYTdHhD9FcUM6OxxQuK5JXrvPH2TSHBdAnM%3D'
          LINK_07: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-539c-81f7-a530-0f81f560c2ac/raw?se=2026-11-11T21%3A43%3A10Z&sp=r&sv=2026-06-06&sr=b&scid=c03797c4-8bfc-54d9-9597-11358e548d48&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T13%3A07%3A06Z&ske=2026-11-12T13%3A07%3A06Z&sks=b&skv=2026-06-06&sig=Dd6OeV/uZHZ1XJIP2wGb8pMmZarFMNiq1YCjg3mS0Jo%3D'
          LINK_08: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-7f1c-81f5-be90-b6bcb1c95e2f/raw?se=2026-11-11T21%3A43%3A45Z&sp=r&sv=2026-06-06&sr=b&scid=3d2e844d-4b35-5dcc-9685-d3fa2b904af2&skoid=a1be202a-6464-476c-a496-723317c4a4db&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T02%3A12%3A42Z&ske=2026-11-12T02%3A12%3A42Z&sks=b&skv=2026-06-06&sig=LDoHQkZh5qdv6NvvY9HsP20vSKPuSQzUaAO30540ukI%3D'
          LINK_09: 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-24a4-81f6-9818-d697990bf024/raw?se=2026-11-11T21%3A43%3A15Z&sp=r&sv=2026-06-06&sr=b&scid=9083ea0f-2318-5516-bccc-467d4592cbd6&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T00%3A46%3A13Z&ske=2026-11-12T00%3A46%3A13Z&sks=b&skv=2026-06-06&sig=gCOrnOWrNMrT/UN4QBWQFCZhqPzSl%2BlZDrbJDAmvcfI%3D'
        run: |
          set -euo pipefail
          mkdir -p parts
          for n in $(seq -w 0 9); do
            key="LINK_${n}"
            echo "Downloading FIX49C piece ${n}"
            curl --fail --show-error --location --retry 5 --retry-delay 3 --connect-timeout 40 --output "parts/PART${n}.bin" "${!key}"
            actual=$(stat -c%s "parts/PART${n}.bin")
            expected=62914560
            if [ "$n" = "09" ]; then expected=57252006; fi
            test "$actual" -eq "$expected" || { echo "::error::Unexpected transfer size ${n}: ${actual}";exit 1; }
          done
      - name: Assemble and verify FIX49C signature-tested APK
        shell: bash
        run: |
          set -euo pipefail
          apk="COD4-ZOMBIES-FIX49C-DEDICATED-USE-ADS-ARM64.apk"
          cat parts/PART{00..09}.bin > "$apk"
          test "$(stat -c%s "$apk")" -eq 623483046
          echo "fc2ce3d7650d1471f6ce066dc5e940d9434a9b080e94cf4d55b751d50f91ec6a  $apk" | sha256sum -c
          unzip -t "$apk" >/dev/null
          python3 - "$apk" <<'PY'
          import sys,zipfile,io
          with zipfile.ZipFile(sys.argv[1]) as z:
            assert len(z.namelist())==419
            with zipfile.ZipFile(io.BytesIO(z.read('assets/assets.zip'))) as inner:
              assert inner.comment==b'XZ-ASSETS-1:9665'
              assert inner.namelist()==['luanti-assets.zip.xz']
          print('APK archive, entry count and XZ payload manifest verified')
          PY
      - name: Publish FIX49C signed prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="fix49c-dedicated-use-ads-android-arm64-test"
          apk="COD4-ZOMBIES-FIX49C-DEDICATED-USE-ADS-ARM64.apk"
          notes="TEST Android ARM64 version based on FIX49 responsive editor and FIX49B 28 individually resized wall-prop OBJ models. Dedicated on-screen USE button now uses Luanti PLACE control; independent ADS button uses native ZOOM touch control with explicit ADS texture; FIRE/DIG and R/AUX1 unchanged. All 28 arsenal items intercept USE on Zombies wall buys, buyable doors, mystery box and perks; ammo crate delegate preserved. ADS is edge-triggered only on ZOOM press and does NOT toggle with USE. Includes 9,665 nested resources (previous 9,663 plus two matching zoom icons); 419 APK entries preserved; 28 modified wall models from earlier FIX49B; original first-person guns, sounds, maps and textures unchanged. App signed with EXACT prior FIX48/FIX49 Android certificate; certificate fingerprint SHA256 271890e4f8c663e7ce83cb9f0470f31685ae46264f8304b915dfab77d15f36a5. SHA256: fc2ce3d7650d1471f6ce066dc5e940d9434a9b080e94cf4d55b751d50f91ec6a. Lua 5.4 mocked tests GREEN. Actual device touchscreen button behavior not yet confirmed; backup worlds before updating. FIX49 remains available. No native Android source recompilation performed; existing separate Place and Zoom controls are relabeled and repurposed."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1;then
            gh release upload "$tag" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "FIX49C TEST — Dedicated USE and ADS (ARM64)" --notes "$notes"
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets
