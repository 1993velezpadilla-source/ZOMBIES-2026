name: IW3 Windows MP dedicated compilation (no game assets)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'third_party/KisakCOD/**'
      - '.github/workflows/iw3-windows-dedi-build.yml'
  push:
    paths:
      - 'third_party/KisakCOD/**'
      - '.github/workflows/iw3-windows-dedi-build.yml'

permissions:
  contents: read

jobs:
  windows-dedicated:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install standalone DirectX 9 SDK import dependencies via NuGet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Join-Path $env:RUNNER_TEMP 'dxpkg'
          nuget install Microsoft.DXSDK.D3DX -Version 9.29.952.8 -OutputDirectory $pkg -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "NuGet install failed" }
          $native = Join-Path $pkg 'Microsoft.DXSDK.D3DX.9.29.952.8\build\native'
          if (!(Test-Path (Join-Path $native 'include'))) { throw "Missing DXSDK headers at $native" }
          if (!(Test-Path (Join-Path $native 'Release\lib\x86'))) { throw "Missing DXSDK x86 libs at $native" }
          "DXSDK_NATIVE=$native" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure KisakCOD Win32 release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'iw3-build'
          cmake -S third_party/KisakCOD -B $out -G 'Visual Studio 17 2022' -A Win32 -DCMAKE_BUILD_TYPE=Release -DCICD=ON "-DDXSDK_DIR=$env:DXSDK_NATIVE"
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration FAILED (not a gameplay test)" }
          "IW3_BUILD_DIR=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile dedicated server, without launching or publishing game binaries
        shell: pwsh
        run: |
          cmake --build $env:IW3_BUILD_DIR --target KisakCOD-dedi --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "KisakCOD-dedi compilation failed" }
      - name: Declare gate (build success != playable Zombies)
        shell: pwsh
        run: |
          Write-Host 'Windows x86 dedicated executable built; still requires licensed COD4 data and separately built RotU assets and scripts.'
