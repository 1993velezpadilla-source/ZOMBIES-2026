name: Arsenal APK fail-closed content audit (host only)
on:
  push:
    branches:
      - feature/luanti-arsenal-apk-gate-20261106
    paths:
      - sandbox/luanti/arsenal_android/**
      - .github/workflows/luanti-arsenal-audit.yml
  pull_request:
    paths:
      - sandbox/luanti/arsenal_android/**
      - .github/workflows/luanti-arsenal-audit.yml
permissions:
  contents: read
jobs:
  inspect-verifier:
    name: Synthetic positive and negative tests only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify audit script compiles
        run: python3 -m py_compile sandbox/luanti/arsenal_android/audit_apk.py sandbox/luanti/arsenal_android/test_audit_apk.py
      - name: Fail-closed APK fixtures
        run: |
          python3 -m pip install --quiet Pillow==12.0.0
          python3 -m unittest discover -s sandbox/luanti/arsenal_android -p 'test_*.py' -v
      - name: Explicitly state limitations
        run: |
          echo 'HOST_AUDITOR_TESTED=YES'
          echo 'REAL_28_WEAPON_APK_TESTED=NO'
          echo 'DEVICE_FPS_TESTED=NO'
          echo 'COMMERCIAL_LICENSE_CLEARED=NO'
