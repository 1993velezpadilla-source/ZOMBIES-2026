name: IW3 original weapon loader full source ARM64 compile (NOT GAME)

on:
  push:
    branches:
      - feature/iw3-native-android-arm64-20261025
    paths:
      - '.github/workflows/iw3-weapon-full-arm64.yml'
      - 'third_party/KisakCOD/src/bgame/bg_weapons_load_obj.cpp'
      - 'third_party/KisakCOD/src/universal/q_shared.cpp'
      - 'third_party/KisakCOD/src/xanim/xanim.h'
  pull_request:
    branches:
      - feature/zombies-offline-sp-weapons-20261024
    paths:
      - '.github/workflows/iw3-weapon-full-arm64.yml'
      - 'third_party/KisakCOD/src/bgame/bg_weapons_load_obj.cpp'
      - 'third_party/KisakCOD/src/universal/q_shared.cpp'
      - 'third_party/KisakCOD/src/xanim/xanim.h'

permissions:
  contents: read

concurrency:
  group: iw3-weapon-full-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-weapon-loader-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NDK_VER: "27.2.12479018"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Android NDK and original engine compile headers
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk/cmdline-tools/latest"
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/commandline-tools.zip" \
            'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
          unzip -qo "$RUNNER_TEMP/commandline-tools.zip" -d "$RUNNER_TEMP/commandline-tools"
          mv "$RUNNER_TEMP/commandline-tools/cmdline-tools/"* "$sdk/cmdline-tools/latest/"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" "ndk;${NDK_VER}"
          echo "ANDROID_NDK_HOME=$sdk/ndk/${NDK_VER}" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libopenal-dev
          mkdir -p "$RUNNER_TEMP/iw3-openal-headers"
          cp -a /usr/include/AL "$RUNNER_TEMP/iw3-openal-headers/"
      - name: Compile entire original KisakCOD weapon loader and parser for AArch64
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          root="$GITHUB_WORKSPACE/third_party/KisakCOD/src"
          mkdir -p "$RUNNER_TEMP/iw3-weapon-objects"
          for file in bgame/bg_weapons_load_obj.cpp universal/q_shared.cpp; do
            obj="$RUNNER_TEMP/iw3-weapon-objects/$(basename "$file" .cpp).o"
            "$ndk/aarch64-linux-android26-clang++" \
              -std=c++20 -DKISAK_SP=1 -DKISAK_OPENAL=1 -fms-extensions \
              -UNDEBUG -O2 -fsigned-char -frounding-math -fno-fast-math \
              -I "$root" \
              -I "$GITHUB_WORKSPACE/third_party/KisakCOD/deps" \
              -I "$RUNNER_TEMP/iw3-openal-headers" \
              -c "$root/$file" -o "$obj"
            "$ndk/llvm-readelf" -h "$obj" | grep -F 'Machine:                           AArch64'
            "$ndk/llvm-nm" -C --defined-only "$obj" > "$obj.symbols"
          done
          grep -F 'BG_LoadWeaponDefInternal(char const*, char const*)' \
            "$RUNNER_TEMP/iw3-weapon-objects/bg_weapons_load_obj.o.symbols"
          grep -F 'ParseConfigStringToStructCustomSize(' \
            "$RUNNER_TEMP/iw3-weapon-objects/q_shared.o.symbols"
          echo 'IW3_ORIGINAL_WEAPON_LOADER_FULL_TU_AARCH64_PASS'
          echo 'IW3_ORIGINAL_CONFIG_PARSER_FULL_TU_AARCH64_PASS'
          echo 'IW3_REAL_WEAPON_ASSET_LOADED=false'
          echo 'IW3_REAL_MAP_LOADED=false'
          echo 'IW3_RENDERER_FRAME_PROVEN=false'
          echo 'IW3_GAMEPLAY_PROVEN=false'
          echo 'IW3_PLAYABLE_APK=false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iw3-original-weapon-full-aarch64-audit
          path: ${{ runner.temp }}/iw3-weapon-objects/
          if-no-files-found: ignore
          retention-days: 7
