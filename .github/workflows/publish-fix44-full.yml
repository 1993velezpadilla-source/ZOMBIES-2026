name: Publish FIX44 FULL APK from split archive
on:
  push:
    paths:
      - '.github/workflows/publish-fix44-full.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
