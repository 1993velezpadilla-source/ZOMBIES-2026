      LINK_11: 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-cda4-822f-8812-dc62a7bdc44e/raw?se=2026-11-11T05%3A05%3A47Z&sp=r&sv=2026-06-06&sr=b&scid=782f2c5c-77d7-505f-a13d-62cf95bfea5c&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T00%3A57%3A44Z&ske=2026-11-12T00%3A57%3A44Z&sks=b&skv=2026-06-06&sig=6dMZnExtVwictCwVArVPJhrAIZEkB/Je5iD2WvPoVeo%3D'
      LINK_12: 'https://sdmntpreastus.oaiusercontent.com/files/00000000-3fac-81f9-b291-81ffb812aa9d/raw?se=2026-11-11T05%3A05%3A44Z&sp=r&sv=2026-06-06&sr=b&scid=c5b3167f-1da3-59e0-a379-50e9e48c95cb&skoid=e96cf01c-9c0f-4e27-b41e-0f2e435e6532&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T01%3A18%3A57Z&ske=2026-11-12T01%3A18%3A57Z&sks=b&skv=2026-06-06&sig=kBxZA4qU53BjjGO0MdtWYJZO7UyOYQ5SeID2X15qbDI%3D'
    steps:
      - name: Install 7-Zip for split ZIP extraction
        run: sudo apt-get update -qq && sudo apt-get install -y p7zip-full

      - name: Download all 12 FIX44 archive pieces from temporary links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parts
          for n in $(seq 1 11); do
            num=$(printf '%02d' "$n")
            key="LINK_${num}"
            echo "Downloading FIX44-FULL.z${num}"
            curl --fail --show-error --location --retry 5 --retry-delay 3 --connect-timeout 30 \
              --output "parts/FIX44-FULL.z${num}" "${!key}"
          done
          curl --fail --show-error --location --retry 5 --retry-delay 3 --connect-timeout 30 \
            --output parts/FIX44-FULL.zip "$LINK_12"
          test $(find parts -maxdepth 1 -type f | wc -l) -eq 12
          ls -lh parts/

      - name: Extract and verify original signed FIX44 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unpacked
          7z x parts/FIX44-FULL.zip -ounpacked -y
          mapfile -d '' apks < <(find unpacked -type f -iname '*.apk' -print0)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected one APK in FIX44-FULL.zip, found ${#apks[@]}"
            exit 1
          fi
          cp "${apks[0]}" COD4-ZOMBIES-CLASSIC-FIX44-FULL-ARM64.apk
          test "$(stat -c%s COD4-ZOMBIES-CLASSIC-FIX44-FULL-ARM64.apk)" -eq 756181086
          echo "9f7f98a77bbe05b7d88cb4ecfc1d2c00998be66532d930363a59e91aa3bb0d28  COD4-ZOMBIES-CLASSIC-FIX44-FULL-ARM64.apk" | sha256sum --check
          echo "FIX44 verified; exact expected original APK."

      - name: Create or update FIX44 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="fix44-full-android-arm64"
          APK="COD4-ZOMBIES-CLASSIC-FIX44-FULL-ARM64.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Zombies Classic — FIX44 FULL (Android ARM64)" \
              --notes "Reconstructed from the 12 FIX44-FULL split ZIP parts. APK 756181086 bytes; SHA-256 9f7f98a77bbe05b7d88cb4ecfc1d2c00998be66532d930363a59e91aa3bb0d28. Android device startup has not yet been confirmed."
          fi
