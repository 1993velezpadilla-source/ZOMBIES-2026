      LINK_06: 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-bc48-81f6-a3bd-86c88eee3f2a/raw?se=2026-11-11T05%3A05%3A38Z&sp=r&sv=2026-06-06&sr=b&scid=03f88ac0-3788-50bd-8682-92d20becb680&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T00%3A46%3A20Z&ske=2026-11-12T00%3A46%3A20Z&sks=b&skv=2026-06-06&sig=z/DMbmX5qHPPhAWAI4Z5%2B2uthtYDto%2B4CAE9lBY2miY%3D'
