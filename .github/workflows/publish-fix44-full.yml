      LINK_09: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-f5e8-81f5-b897-3c1e363aeb13/raw?se=2026-11-11T05%3A05%3A40Z&sp=r&sv=2026-06-06&sr=b&scid=f2f173af-6e3f-5c94-b9ce-4d0878d353a9&skoid=a1be202a-6464-476c-a496-723317c4a4db&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T02%3A15%3A06Z&ske=2026-11-12T02%3A15%3A06Z&sks=b&skv=2026-06-06&sig=/jTPPjJFLxhCKKL0X6TTqhvOb6/1lAsD7qC1yQ5ONF8%3D'
