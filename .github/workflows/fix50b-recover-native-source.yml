name: FIX50B forensic recovery of exact FIX49C native source
on:
  push:
    branches:
      - fix/fix50b-restore-cod4-native-bridge-20261111
    paths:
      - 'incoming/luanti-fix50b/source_recovery.py'
      - '.github/workflows/fix50b-recover-native-source.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  recover-exact-header-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download original FIX49C APK from our verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p fix50b-source-input
          gh release download fix49c-dedicated-use-ads-android-arm64-test \
            --repo "${{ github.repository }}" \
            --pattern 'COD4-ZOMBIES-FIX49C-DEDICATED-USE-ADS-ARM64.apk' \
            --dir fix50b-source-input
          test -s fix50b-source-input/COD4-ZOMBIES-FIX49C-DEDICATED-USE-ADS-ARM64.apk
      - name: Examine APK and nested source ZIPs; accept only authentic originals
        run: |
          python3 incoming/luanti-fix50b/source_recovery.py \
            fix50b-source-input/COD4-ZOMBIES-FIX49C-DEDICATED-USE-ADS-ARM64.apk
      - name: Commit all six byte-for-byte recovered original headers
        run: |
          set -euo pipefail
          src=fix50b-recovery-report/original_headers
          dst=incoming/luanti-fix50b/native/original_headers
          mkdir -p "$dst"
          for name in ak47_motion.h ak47_weapon_params.h m9_weapon_params.h weapon_bridge.h weapon_hud.h native_attachment_override.h; do
            test -s "$src/$name"
            cp "$src/$name" "$dst/$name"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dst/ak47_motion.h" "$dst/ak47_weapon_params.h" "$dst/m9_weapon_params.h" "$dst/weapon_bridge.h" "$dst/weapon_hud.h" "$dst/native_attachment_override.h"
          if ! git diff --cached --quiet; then
            git commit -m 'fix(fix50b): restore exact COD4 bridge headers from working FIX49C APK'
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Dispatch the genuine FIX50B Android ARM64 compilation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run fix50b-build-arm64-preserved-engine.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"
      - name: Upload forensic report and source hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FIX50B-FIX49C-ORIGINAL-SOURCE-RECOVERY-REPORT
          path: fix50b-recovery-report/
          if-no-files-found: warn
          retention-days: 14
