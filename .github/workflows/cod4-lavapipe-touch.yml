name: COD4 Lavapipe real scene touch gauntlet
on:
  push:
    paths:
      - '.github/workflows/cod4-lavapipe-touch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lavapipe-touch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout test scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download originals temporarily and stage only required parts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p _release_assets/c4 _release_assets/cod4
          gh release download gofile-p2DdQHsz --repo "$GITHUB_REPOSITORY" --pattern 'C4-Mocs.zip.part-*' --dir _release_assets/c4
          gh release download mediafire-COD4-apk --repo "$GITHUB_REPOSITORY" --pattern COD4.apk --dir _release_assets/cod4
          echo '40386503d564b0985423339b5ccd5611dc60ce08ebe1b4ae494d4de22a62473c  _release_assets/cod4/COD4.apk' | sha256sum -c
          python3 tools/prepare_cod4_core_fixture.py
      - name: Set up analysis libraries
        run: |
          python3 -m venv /tmp/cod4-lavapipe
          /tmp/cod4-lavapipe/bin/pip --disable-pip-version-check install --quiet 'Pillow>=10,<13'
          /tmp/cod4-lavapipe/bin/python -m py_compile tools/test_android_source_import.py tools/probe_android_renderer.py tools/probe_cod4_touch_controls.py
      - name: Enable KVM on GitHub Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render genuine level and test Android touchscreen controls (offline)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 3072M
          disk-size: 16384M
          force-avd-creation: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu lavapipe -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -e
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb install -r _release_assets/cod4/COD4.apk
            /tmp/cod4-lavapipe/bin/python tools/test_android_source_import.py
            /tmp/cod4-lavapipe/bin/python - <<'PY'
            import json
            from pathlib import Path
            root=Path("smoke-out/real-data-test")
            result=json.loads((root/"result.json").read_text())
            render=json.loads((root/"renderer-diagnostic.json").read_text())
            touch=json.loads((root/"touch-control-report.json").read_text())
            latest=render["snapshots"][-1]["regions"]["center_scene"]
            findings={"backend":"lavapipe","imported":result["import_banner_observed"],
                      "menu_launched":result["campaign_button_clicked"],
                      "native_process_alive":touch["campaign_process_alive_after_input"],
                      "controls_injected":len(touch["tests"]),
                      "latest_scene_color":latest,
                      "gameplay_controls_verified":False,
                      "fps_acceptable":False}
            print("LAVAPIPE_TOUCH_GATE",json.dumps(findings))
            (root/"lavapipe-touch-gate.json").write_text(json.dumps(findings,indent=2)+"\n")
            if not findings["imported"] or not findings["native_process_alive"] or findings["controls_injected"]!=7:
                raise SystemExit("Android touch smoke execution failed")
            PY
      - name: Preserve only emulator screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cod4-lavapipe-real3d-touch
          path: |
            smoke-out/real-data-test/*.png
            smoke-out/real-data-test/result.json
            smoke-out/real-data-test/lavapipe-touch-gate.json
            smoke-out/real-data-test/renderer-diagnostic.json
            smoke-out/real-data-test/touch-control-report.json
            smoke-out/real-data-test/renderer-mem-last.txt
            smoke-out/real-data-test/runtime-filtered-logcat.txt
          retention-days: 14
          if-no-files-found: warn
      - name: Erase temporary original content
        if: always()
        run: |
          rm -rf _runtime_temp _release_assets
          echo 'Game data not distributed via CI artifacts.'
