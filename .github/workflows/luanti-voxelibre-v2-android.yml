name: Build Voxel Sandbox V2 seven-map Android APK

on:
  push:
    branches:
      - feature/voxel-sandbox-v2-seven-map-templates-20261105
    paths:
      - sandbox/luanti/**
      - .github/workflows/luanti-voxelibre-v2-android.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: V2 Android ARM64 seven templates
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout separate V2 recipe
        uses: actions/checkout@v4

      - name: Install native build tools and Lua syntax checker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext zip unzip lua5.1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Source gates and Lua syntax
        run: |
          set -euo pipefail
          python3 sandbox/luanti/v2/verify_v2.py
          luac5.1 -p sandbox/luanti/v2/dlg_zmap_world.lua
          luac5.1 -p sandbox/luanti/v2/zmapdev/init.lua

      - name: Obtain pinned open-source Luanti and VoxeLibre
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 5.18.0 https://github.com/luanti-org/luanti.git "$RUNNER_TEMP/luanti"
          git clone --depth 1 --branch master https://github.com/VoxeLibre/VoxeLibre.git "$RUNNER_TEMP/voxelibre"
          test "$(git -C "$RUNNER_TEMP/voxelibre" rev-parse HEAD)" = "4492ce6ff8d856daa4567abe2ea689f4e7a39842"
          mkdir -p "$RUNNER_TEMP/luanti/games"
          mv "$RUNNER_TEMP/voxelibre" "$RUNNER_TEMP/luanti/games/voxelibre"
          rm -rf "$RUNNER_TEMP/luanti/games/voxelibre/.git"
          python3 "$GITHUB_WORKSPACE/sandbox/luanti/prepare.py" "$RUNNER_TEMP/luanti"
          python3 "$GITHUB_WORKSPACE/sandbox/luanti/v2/patch_v2.py" "$RUNNER_TEMP/luanti"
          luac5.1 -p "$RUNNER_TEMP/luanti/builtin/mainmenu/tab_local.lua"
          luac5.1 -p "$RUNNER_TEMP/luanti/builtin/mainmenu/init.lua"
          luac5.1 -p "$RUNNER_TEMP/luanti/builtin/mainmenu/dlg_zmap_world.lua"

      - name: Compile debug-signed ARM64 APK separately from working V1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/luanti/android"
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Inspect actual generated APK
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/luanti/android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk"
          python3 sandbox/luanti/verify_apk.py "$APK"
          python3 sandbox/luanti/v2/verify_v2.py "$APK"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging "$APK" | grep -m1 "package:"
          "$AAPT" dump badging "$APK" | grep -q "name='com.xziel.voxelsandbox.v2'"
          mkdir -p "$RUNNER_TEMP/v2-dist"
          cp "$APK" "$RUNNER_TEMP/v2-dist/Voxel-Sandbox-V2-7-Maps-ARM64.apk"
          sha256sum "$RUNNER_TEMP/v2-dist/Voxel-Sandbox-V2-7-Maps-ARM64.apk"

      - name: Upload APK to Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voxel-Sandbox-V2-seven-templates-APK
          path: ${{ runner.temp }}/v2-dist/Voxel-Sandbox-V2-7-Maps-ARM64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct GitHub APK prerelease
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "voxel-sandbox-v2-seven-maps-${GITHUB_RUN_NUMBER}" \
            "$RUNNER_TEMP/v2-dist/Voxel-Sandbox-V2-7-Maps-ARM64.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Voxel Sandbox V2 seven map templates ${GITHUB_RUN_NUMBER}" \
            --notes "Standalone test-only V2 APK. Original V1 app unchanged. Survival stays normal; Create Map offers 64, 128, 256, 384, 512, 768, 1024 flat worlds with permanent semi-transparent red boundaries. Requires physical Android test."
