name: FIX52 VoxeLibre V26 Zombie HP crash repair
on:
  push:
    branches: [hotfix/fix52-v26-mcl-damage-20261112]
    paths:
      - '.github/workflows/fix52-v26-mcl-damage-hotfix.yml'
      - 'incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/v26_runtime.lua'
      - 'incoming/luanti-fix50b/tests/test_v26_original.lua'
      - 'incoming/luanti-fix50b/tests/test_v26_mcl_damage.lua'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fix52-v26-voxelibre-hpcrash
  cancel-in-progress: false
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Test original v26 gameplay, 28 weapons and USE
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          for f in incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/*.lua; do luac5.4 -p "$f"; done
          lua5.4 incoming/luanti-fix50b/tests/test_v26_original.lua
          lua5.4 incoming/luanti-fix50b/tests/test_runtime.lua
      - name: Exercise the real VoxeLibre mcl_damage code against the fixed zombie reason
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 \
            https://raw.githubusercontent.com/VoxeLibre/voxelibre/46cb28834ed4318363bffe0c55101c1cba6f15d9/mods/CORE/mcl_damage/init.lua \
            -o "$RUNNER_TEMP/mcl_damage_init.lua"
          grep -Fq 'mcl_damage.from_punch(mcl_reason, mt_reason.object)' "$RUNNER_TEMP/mcl_damage_init.lua"
          lua5.4 incoming/luanti-fix50b/tests/test_v26_mcl_damage.lua "$RUNNER_TEMP/mcl_damage_init.lua"
      - name: Download original FIX52 APK and stage ONE changed Lua
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p fix52-hp/input fix52-hp/overlay fix52-hp/out
          gh release download fix52-original-v26-zombies-port-arm64-playtest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'COD4-ZOMBIES-FIX52-ORIGINAL-V26-PORT-ARM64.apk' \
            --dir fix52-hp/input
          cp incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/v26_runtime.lua \
            fix52-hp/overlay/v26_runtime.lua
      - name: Repack original FIX52 game with only the mob damage fix
        run: |
          set -euo pipefail
          python3 incoming/luanti-fix50b/build_playable_test.py \
            --fix49c fix52-hp/input/COD4-ZOMBIES-FIX52-ORIGINAL-V26-PORT-ARM64.apk \
            --rebuilt fix52-hp/input/COD4-ZOMBIES-FIX52-ORIGINAL-V26-PORT-ARM64.apk \
            --lua incoming/luanti-fix50b/games/voxelibre/mods/xz_zombies_classic/init.lua \
            --overlay-dir fix52-hp/overlay \
            --output fix52-hp/out/unsigned.apk
      - name: Verify only v26_runtime.lua changed; preserve 28 guns, original models, all 9682 assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io,lzma,json,zipfile,pathlib
          base=pathlib.Path('fix52-hp/input/COD4-ZOMBIES-FIX52-ORIGINAL-V26-PORT-ARM64.apk')
          new=pathlib.Path('fix52-hp/out/unsigned.apk')
          report=json.loads(pathlib.Path('fix52-hp/out/packaging_report.json').read_text())
          assert report['assets']['baseline_asset_count']==9682,report
          assert report['assets']['candidate_asset_count']==9682,report
          changed=report['assets']['changed']
          assert set(changed)=={
            'games/voxelibre/mods/xz_zombies_classic/init.lua',
            'games/voxelibre/mods/xz_zombies_classic/v26_runtime.lua',
          },changed
          with zipfile.ZipFile(base) as old, zipfile.ZipFile(new) as fixed:
            for entry in old.infolist():
              if entry.filename=='assets/assets.zip' or entry.filename.startswith('META-INF/'):
                continue
              assert old.read(entry.filename)==fixed.read(entry.filename),f'Original APK binary altered: {entry.filename}'
            def contents(apk):
              with zipfile.ZipFile(io.BytesIO(apk.read('assets/assets.zip'))) as outer:
                assert outer.comment==b'XZ-ASSETS-1:9682',outer.comment
                with zipfile.ZipFile(io.BytesIO(lzma.decompress(outer.read('luanti-assets.zip.xz')))) as z:
                  return {name:z.read(name) for name in z.namelist()}
            before,after=contents(old),contents(fixed)
            assert set(before)==set(after)
            key='games/voxelibre/mods/xz_zombies_classic/v26_runtime.lua'
            assert before[key]!=after[key], 'Crash reason did not change'
            for name in before:
              if name!=key:
                assert before[name]==after[name],f'Other original game resource changed: {name}'
            assert b'_mcl_type="mob"' in after[key]
            assert b'_mcl_direct=obj' in after[key]
            assert b'type="punch",from="v26_zombie"' not in after[key]
          print('PASS: original COD4 native engine identical, original 89-frame barricade and all assets preserved')
          PY
      - name: Sign isolated hotfix test APK and verify
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/zipalign" -f -p 4 fix52-hp/out/unsigned.apk fix52-hp/out/aligned.apk
          keytool -genkeypair -keystore "$RUNNER_TEMP/fix52-hp.jks" -alias hotfix \
            -storepass android -keypass android -keyalg RSA -keysize 3072 -validity 3650 -noprompt \
            -dname 'CN=FIX52 V26 HP Crash Repair,OU=Development,O=Xziel,C=US'
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/fix52-hp.jks" \
            --ks-key-alias hotfix --ks-pass pass:android --key-pass pass:android \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out fix52-hp/out/COD4-ZOMBIES-FIX52-VOXELIBRE-HP-CRASH-REPAIR-ARM64.apk \
            fix52-hp/out/aligned.apk
          "$TOOLS/apksigner" verify --verbose fix52-hp/out/COD4-ZOMBIES-FIX52-VOXELIBRE-HP-CRASH-REPAIR-ARM64.apk
          "$TOOLS/aapt" dump badging fix52-hp/out/COD4-ZOMBIES-FIX52-VOXELIBRE-HP-CRASH-REPAIR-ARM64.apk | tee fix52-hp/out/package.txt
          grep -q "package: name='com.xziel.zombies.fix50btest'" fix52-hp/out/package.txt
          unzip -t fix52-hp/out/COD4-ZOMBIES-FIX52-VOXELIBRE-HP-CRASH-REPAIR-ARM64.apk >/dev/null
          sha256sum fix52-hp/out/COD4-ZOMBIES-FIX52-VOXELIBRE-HP-CRASH-REPAIR-ARM64.apk | tee fix52-hp/out/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FIX52-VOXELIBRE-ZOMBIE-HP-HOTFIX-ARM64
          if-no-files-found: error
          retention-days: 14
          path: |
            fix52-hp/out/COD4-ZOMBIES-FIX52-VOXELIBRE-HP-CRASH-REPAIR-ARM64.apk
            fix52-hp/out/packaging_report.json
            fix52-hp/out/package.txt
            fix52-hp/out/sha256.txt
      - name: Publish repaired FIX52 Android after all gates pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create fix52-v26-voxelibre-mob-hp-crash-repair-arm64 \
            fix52-hp/out/COD4-ZOMBIES-FIX52-VOXELIBRE-HP-CRASH-REPAIR-ARM64.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'FIX52 V26 VoxeLibre HP crash repair Android ARM64' \
            --notes 'Fix for mcl_damage/init.lua:101: Zombie melee now passes type=set_hp, _mcl_type=mob, _mcl_direct and _mcl_source pointing to the actual attacking zombie ObjectRef. Tested with the real VoxeLibre damage engine code. Only v26_runtime.lua changed out of 9682 original assets. Exact COD4 native 28-gun engine, animations, ADS, independent USE, and original NZP barricade models, textures, audio retained. Device test still required. The app keeps the test package com.xziel.zombies.fix50btest but uses a new temporary signing key; back up test worlds and uninstall only the old FIX52 TEST app before installation. Do not uninstall FIX49C.'
